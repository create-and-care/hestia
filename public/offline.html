<!doctype html>

<html lang="en">

  <head>

    <title>You are offline — Hestia</title>

    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <meta name="robots" content="noindex, nofollow">

    <style>

      *, *::before, *::after {
        box-sizing: border-box;
      }

      * {
        margin: 0;
      }

      html {
        font-size: 16px;
      }

      body {
        background: #FBF7F4;
        color: #2A211C;
        display: grid;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Aptos, Roboto, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
        font-size: clamp(1rem, 2.5vw, 2rem);
        -webkit-font-smoothing: antialiased;
        font-style: normal;
        font-weight: 400;
        letter-spacing: -0.0025em;
        line-height: 1.4;
        min-height: 100dvh;
        place-items: center;
        text-rendering: optimizeLegibility;
        -webkit-text-size-adjust: 100%;
      }

      #title {
        font-size: 1.4em;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.1;
      }

      #status {
        color: #A85030;
        font-size: 0.9em;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #14100E;
          color: #F2EBE5;
        }

        #status {
          color: #CE7B56;
        }
      }

      b, strong {
        font-weight: 700;
      }

      main {
        display: grid;
        gap: 1em;
        padding: 2em;
        place-items: center;
        text-align: center;
      }

      main header {
        display: grid;
        gap: 0.5em;
        place-items: center;
      }

      main article {
        width: min(100%, 30em);
      }

      main article p {
        font-size: 75%;
      }

      a.retry {
        background: #A85030;
        border-radius: 8px;
        color: #FBF7F4;
        display: inline-block;
        font-size: 70%;
        font-weight: 600;
        margin-top: 0.5em;
        min-height: 44px;
        line-height: 44px;
        padding: 0 1.25em;
        text-decoration: none;
      }

      img {
        height: 88px;
        width: 88px;
      }

    </style>

  </head>

  <body>

    <!-- This file lives in public/offline.html and is precached by the service
         worker (app/views/pwa/service-worker.js). It is the only page the
         worker caches: it is served when a navigation fails with no network,
         in place of the browser's own error page. Everything in it is inline,
         because by definition nothing else can be fetched when it is shown. -->

    <main>
      <header>
        <img src="/icon.svg" alt="" width="88" height="88">
        <p id="status">Offline</p>
        <p id="title">You are offline</p>
      </header>
      <article>
        <p><strong>Hestia needs a connection to show this page.</strong> Anything you already had open is still there — go back, or try again once the network returns.</p>
        <p><a class="retry" href="/">Try again</a></p>
      </article>
    </main>

  </body>

</html>
