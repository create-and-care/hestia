fr:
  roadmap:
    show:
      title: Feuille de route
      description: >-
        La chronologie du projet, de la v0 au dernier chantier livré — et ce qui vient
        ensuite. Cette page est désormais l'unique source de vérité sur l'avancement de Hestia ;
        elle remplace la Spécification et le Plan d'implémentation d'origine, dont le contenu a
        été entièrement repris ici. Historique précis des versions dans CHANGELOG.md.
      status:
        done: Fait
        upcoming: À venir
      today: Aujourd'hui
    milestones:
      foundation:
        title: "Fondations"
        items:
          - "Utilisateur, Session, Foyer, Membership (rôles membre/admin, code d'invitation unique)"
          - "Cloisonnement multi-foyer (Current.household, concern HouseholdScoped)"
          - "Inscription, onboarding (créer ou rejoindre un foyer via code), tableau de bord"
      design_system:
        title: "Bibliothèque de composants Ui::"
        items:
          - "Une cinquantaine de ViewComponents façon shadcn/ui (boutons, dialogues, calendrier, graphiques, combobox...) exposés sur /design-system"
          - "Base Tailwind v4 et tokens de design (couleurs sémantiques, dark mode)"
      wave_2a:
        title: "Vague 2.a — Modules prioritaires"
        items:
          - "Courses, Frigo, Recettes, Tâches, Calendrier : modèle, contrôleur, vues, temps réel"
          - "Services par domaine (Courses::AddItem, Frigo::AddItem, Tasks::CreateTask, Calendar::CreateEvent...)"
      wave_2b:
        title: "Vague 2.b — Modules satellites"
        items:
          - "11 modules : Notes, Anniversaires, Adresses, Prestataires, Fidélité, Animaux, Véhicules, Cave à vin, Déchets, Bébé, Messages"
      wave_2c:
        title: "Vague 2.c — Logique métier plus riche"
        items:
          - "Menu (planification des repas), Routines (moteur de récurrence partagé avec le Calendrier)"
          - "Extérieur (jardin et piscines), Budget (calcul automatique de répartition), Documents (stockage via Active Storage)"
      wave_2d:
        title: "Vague 2.d — Déviations d'architecture"
        items:
          - "Cadeaux : partage public non authentifié par jeton (g/:token)"
          - "Cercles : indépendants du foyer, regroupent des utilisateurs au-delà du foyer"
          - "Voyage : sous-contexte transverse (trip_id) sur Adresses, Notes, Tâches, Courses"
          - "Bien-être : cloisonnement strict par utilisateur, jamais par foyer — même un admin n'y a pas accès"
      pdf_export_reordering:
        title: "Export PDF & réordonnancement"
        items:
          - "Export PDF de la liste de courses et du mois de calendrier affiché (Prawn)"
          - "Réordonnancement par glisser-déposer sur les courses, les tâches et les cartes de fidélité"
      reminders_notifications:
        title: "Rappels & notifications"
        items:
          - "Notification, NotificationPreference, TaskReminder, EventReminder"
          - "Jobs Solid Queue : Reminders::DeliverDue (échéances) et Reminders::DailyDigest (récapitulatif quotidien, anniversaires du jour inclus)"
          - "Badge de notifications non lues et page de préférences par utilisateur"
      external_integrations_v1:
        title: "Intégrations externes"
        items:
          - "Open Food Facts pour le scan de code-barres (Courses, Frigo)"
          - "Géocodage Nominatim pour la recherche d'adresses"
          - "Jours fériés France / Belgique / Suisse sur le Calendrier, pays configurable par foyer"
      reference_catalogs:
        title: "Catalogues de référence"
        items:
          - "Catalogue d'enseignes de fidélité (une dizaine pour commencer, Fidélité)"
          - "Catalogue de fiches d'entretien de plantes (6 fiches pour commencer, Extérieur)"
      api_and_mobile_skeleton:
        title: "API api/v1 & squelette mobile"
        items:
          - "ApiToken, Api::V1::BaseController, endpoints REST pour Courses, Frigo, Recettes, Tâches, Calendrier"
          - "Squelette client Flutter : écran de connexion, Courses en lecture seule"
          - "Synchronisation calendrier externe : premier scaffold (Google/Microsoft/CalDAV), flux réel pas encore branché"
      governance:
        title: "Gouvernance & documentation"
        items:
          - "LICENSE (AGPLv3), README, CONTRIBUTING, CHANGELOG"
          - "Première version de la page Roadmap dans l'application"
      i18n:
        title: "Internationalisation complète"
        items:
          - "Anglais par défaut, préférence de langue par utilisateur (français disponible)"
          - "Les 25 modules migrés vers I18n"
      reliability_quality:
        title: "Fiabilité & qualité"
        items:
          - "SimpleCov (couverture de tests), Bullet (détection des requêtes N+1), Sentry (suivi d'erreurs en production)"
          - "mission_control-jobs : interface d'administration Solid Queue sur /jobs, fermée par défaut"
          - "Fuseau horaire explicite par foyer pour les calculs sensibles au jour (échéances, péremption, anniversaires)"
          - "Vrais tests système Capybara et 77 nouveaux fichiers de tests comblant le manque de couverture"
      external_calendar_sync_real:
        title: "Synchronisation calendrier externe réelle"
        items:
          - "Flux OAuth2 complet pour Google et Microsoft, avec rafraîchissement automatique du jeton expiré"
          - "CalDAV (Apple, Nextcloud, Fastmail...) via une véritable requête REPORT calendar-query"
          - "Jetons d'accès chiffrés au repos (Active Record Encryption)"
      api_v1_full:
        title: "API api/v1 étendue aux 25 modules"
        items:
          - "Les 20 modules restants exposés : Notes, Anniversaires, Adresses, Prestataires, Fidélité, Animaux, Véhicules, Cave à vin, Déchets, Bébé, Messages, Menu, Routines, Extérieur, Budget, Documents, Cadeaux, Cercles, Voyage, Bien-être"
          - "Cloisonnement respecté pour les cas particuliers : Cercles par appartenance (non par foyer), Bien-être par utilisateur, Messages par participant à la conversation"
      navigation_settings:
        title: "Navigation & paramètres du foyer"
        items:
          - "Barre latérale repliable, regroupée par thème"
          - "Paramètres du foyer réunis en onglets : général, membres, notifications, API, sessions, modules, roadmap"
      recipe_catalog:
        title: "Catalogue de recettes & découverte"
        items:
          - "Catalogue partagé de recettes prêtes à cloner dans son livre (jusqu'à 95 recettes rédigées à la main)"
          - "Suggestions de recettes à partir du contenu du frigo"
      visual_polish_icons:
        title: "Polish visuel transverse"
        items:
          - "Remplacement des émojis par la bibliothèque d'icônes Lucide dans toute l'application"
          - "Fil d'Ariane et pagination cohérents sur chaque page de module"
      ui_migration_a11y:
        title: "Migration Ui:: complète & accessibilité"
        items:
          - "Toutes les vues de l'application migrées vers les composants Ui::, avec tests dédiés"
          - "Premiers correctifs d'accessibilité et correction du sélecteur de langue"
      global_search:
        title: "Recherche globale ⌘K"
        items:
          - "Palette de commandes ⌘K remplaçant le filtre de la barre latérale"
          - "Couvre l'ensemble des modules activés par le foyer"
      refinement_wave_day1:
        title: "Vague de perfectionnement — jour 1 : Courses, Calendrier, Tâches, Cadeaux, Cercles"
        items:
          - "Courses : tri par ordre de rayon réel, outils de gestion du catalogue"
          - "Calendrier : vues Jour/Semaine, distinction occurrence unique vs série récurrente, anniversaires affichés"
          - "Tâches : confirmations de suppression, réordonnancement au clavier, tri automatique"
          - "Cadeaux : sécurisation de l'annulation de réservation publique, propriété et visibilité des listes"
          - "Cercles : posts avec photo, correction de bugs de cohérence"
      refinement_wave_day2a:
        title: "Vague de perfectionnement — jour 2 : Frigo, Recettes, Notes, Anniversaires, Adresses, Prestataires"
        items:
          - "Frigo : photos des plats préparés, onglets par emplacement, confirmations de suppression"
          - "Recettes : vrai mode cuisine (écran maintenu allumé), photos, filtrage par catégorie"
          - "Notes : filtres, mise en forme enrichie, liens"
          - "Anniversaires : vue calendrier, durcissement, accessibilité"
          - "Adresses : photo, accessibilité, interconnexions avec les autres modules"
          - "Prestataires : types personnalisables, accessibilité, import"
      refinement_wave_day2b:
        title: "Vague de perfectionnement — jour 2 : Fidélité, Animaux, Véhicules, Cave à vin, Déchets, Bébé, Messages"
        items:
          - "Fidélité : vrais codes-barres/QR détectés, mode kiosque plein écran en caisse"
          - "Animaux, Véhicules, Cave à vin : édition, photo, temps réel, correctif de requêtes N+1"
          - "Déchets : édition, lien avec le Calendrier, badges visuels"
          - "Bébé : vrai minuteur d'allaitement/biberon, édition, interconnexions"
          - "Messages : correctif temps réel, confidentialité, interconnexions"
      refinement_wave_day3a:
        title: "Vague de perfectionnement — jour 3 : Menu, Routines, Extérieur, Budget, Documents, Voyage, Bien-être"
        items:
          - "Menu : réordonnancement, édition, export direct vers Courses"
          - "Routines : historique des complétions, accessibilité, dark mode"
          - "Extérieur : édition, historique, accessibilité, dark mode"
          - "Budget : édition, lien avec Voyage, accessibilité, dark mode"
          - "Documents : visionneuse PDF intégrée, partage, interconnexions"
          - "Voyage : onglets à la carte, isolation du Menu par séjour, édition"
          - "Bien-être : graphique de poids, édition, historique complet, accessibilité"
      refinement_wave_day3b:
        title: "Vague de perfectionnement — jour 3 : Fondations, Design system, Navigation"
        items:
          - "Fondations : widgets du tableau de bord, gestion des membres et du foyer (quitter, exclure, promouvoir, supprimer), sessions actives révocables"
          - "Fondations : durcissement — mot de passe minimal 8 caractères, expiration configurable des jetons API"
          - "Design system : tokens dark mode appliqués à l'ensemble de l'application, dernières chaînes traduites"
          - "Navigation : couverture de recherche étendue, notifications cliquables vers leur source, page Roadmap reconstruite en chronologie"
      account_privacy:
        title: "Compte utilisateur & confidentialité"
        items:
          - "Suppression du compte utilisateur"
          - "Export des données personnelles, pour la portabilité même en auto-hébergement"
          - "Réinitialisation des données module par module : aujourd'hui c'est tout ou rien (supprimer le foyer), et désactiver un module laisse ses lignes intactes et invisibles"
      household_activity_export:
        title: "Tableau de bord : activité & export"
        items:
          - "Fil d'activité du foyer (qui a fait quoi, quand)"
          - "Export des données du foyer au format JSON/CSV"
      public_route_hardening:
        title: "Durcissement des routes publiques"
        items:
          - "Limitation de débit sur la liste de cadeaux publique (g/:token) : une limite de lecture et une limite d'écriture distinctes sur la réservation, plus une page 429 aux couleurs du site"
          - "Retrait du jeton d'API sans expiration : trois durées au choix, 90 jours par défaut"
          - "Audit d'accessibilité automatisé : bin/rails visual:check mesure contraste, taille de cible et taille de police sur 273 routes × 2 thèmes × 2 largeurs, et test/lib/ porte les tests de contraste et d'accessibilité"
      security_performance_hardening:
        title: "Sécurité & performance mesurée"
        items:
          - "Content-Security-Policy réellement émise (elle était entièrement commentée), avec un nonce par requête sur script-src"
          - "force_ssl / assume_ssl activables par FORCE_SSL, sans casser un accès en HTTP sur le réseau local"
          - "Modules désactivés désormais fermés côté API JSON aussi : une seule table de correspondance pour le web et l'API, et un test qui parcourt les routes pour qu'aucun contrôleur ne reste non classé"
          - "Mise en cache des appels Open Food Facts et Nominatim — premiers usages de Rails.cache, qui fixent les conventions de clé et de TTL"
          - "Tableau de bord filtré en SQL : chaque encart demande à la base les cinq lignes qu'il affiche au lieu de charger la relation entière"
          - "Expansion des récurrences bornée par la fenêtre de dates, et non plus par l'ancienneté de la série"
          - "Chargement anticipé sur les listes qui en manquaient, énuméré en faisant échouer Bullet dans la suite de tests (BULLET_RAISE=1)"
      reference_catalog_growth:
        title: "Enrichir les catalogues & les automatismes"
        items:
          - "Étendre le catalogue de fiches Extérieur au-delà des 6 fiches de départ"
          - "Étendre le catalogue de fidélité au-delà de la dizaine de départ"
          - "Fusion intelligente des ingrédients (doublons, conversion d'unités) lors de l'ajout d'une recette aux courses"
      design_system_measured:
        title: "Design system : les écarts mesurés"
        items:
          - "Rapport visual:check rejoué sur 273 routes × 2 thèmes × 2 largeurs, et corrigé d'après ses chiffres plutôt que d'après une impression"
          - "Ui::ItemComponent remis sur la grille de 4 px sans déplacer les listes de l'application : un plancher de hauteur garde la ligne courante au pixel près"
          - "Échelle de z-index nommée (sticky, floating, overlay, toast) : l'ordre d'empilement était douze nombres choisis à la main et écrit nulle part"
          - "Squelettes de chargement dans les turbo-frames différés, avec un libellé pour lecteur d'écran — une forme grise ne dit rien"
          - "Documentation du design system rendue utilisable sur mobile : elle débordait de 80 px à 390 px, sur les pages mêmes qui décrivent l'échelle typographique"
          - "icon: et icon_position: sur Ui::ButtonComponent, la taille du glyphe découlant de celle du bouton"
      i18n_guardrails:
        title: "Internationalisation : des garde-fous plutôt que de la discipline"
        items:
          - "Blocs date/time formats dans les deux locales : il n'en existait aucun, les appels l() tenaient par les défauts de rails-i18n"
          - "51 strftime d'affichage migrés vers l() — ils codaient « %d/%m/%Y » en dur, donc un lecteur anglophone voyait 07/08/2026 pour le 7 août et lisait 8 juillet"
          - "bin/rails i18n:check (et son job CI) échoue sur une traduction manquante et sur toute clé présente dans une seule des deux locales"
          - "Un test refuse tout nouveau strftime d'affichage et vérifie qu'une date numérique se lit bien différemment en anglais et en français"
      pwa:
        title: "Application installable (PWA)"
        items:
          - "Manifeste et service worker branchés : routes, lien dans le layout, et une couleur de thème et des icônes carrées qui remplacent les valeurs du gabarit Rails"
          - "Icônes 192/512 et variante « maskable » générées depuis le logo, et une icône vectorielle à la place du cercle rouge qui servait de favicon"
          - "Page hors-ligne servie par le service worker quand une navigation échoue — seule ressource mise en cache, servir un tableau de bord périmé serait pire que ne rien servir"
          - "Installable sur mobile et bureau en attendant la parité complète du client Flutter"
      shared_link_controls:
        title: "Maîtrise des liens partagés"
        items:
          - "Expiration et mot de passe sur les partages publics de liste de cadeaux : un lien partagé une fois vaut aujourd'hui pour toujours"
          - "Mode invité à durée limitée, pour laisser voir une liste de courses à quelqu'un sans compte Hestia"
      household_logistics:
        title: "Logistique du foyer"
        items:
          - "Factures récurrentes dans Budget : un loyer se resaisit chaque mois alors que le moteur de récurrence et les rappels existent tous les deux"
          - "Inventaire des biens (photo, valeur, date d'achat, garantie), pour l'assurance et la revente"
          - "Calendrier des vacances scolaires françaises (zones A/B/C) — les jours fériés sont couverts, pas ce qui structure l'année d'un foyer avec enfants"
          - "Détection des doublons à l'ajout aux courses, et suggestions tirées de l'historique d'achat déjà en base"
      wired_patterns:
        title: "Des motifs déjà présents dans le dépôt, enfin branchés"
        items:
          - "Pièces jointes et réactions sur les messages : CirclePost porte déjà has_one_attached :photo et un modèle CirclePostReaction complet avec son contrôleur et ses routes — le motif est écrit, testé et livré, il n'est simplement pas appliqué aux messages"
          - "Graphiques dans Budget : Ui::ChartComponent tourne déjà dans Piscine et Bien-être, quand budget/show n'a qu'une barre de progression"
          - "quantity et unit sur les articles du frigo : les articles de courses portent les deux, ceux du frigo aucun des deux, et les deux services Frigo↔Courses traversent déjà cette frontière en perdant l'information"
      tasks_and_recurrence:
        title: "Tâches et récurrences, en profondeur"
        items:
          - "Sous-tâches, priorité et tags sur les tâches — aujourd'hui atténué par les catégories kanban, un emoji et un statut d'échéance dérivé"
          - "Récurrences de niveau RRULE : le service Recurrence couvre quotidien/hebdomadaire/mensuel/annuel et rien d'autre — pas de « 2e mardi », pas de nombre d'occurrences, pas de règle multi-jours"
      cooking_and_shopping:
        title: "Cuisine et courses, au-delà de la base"
        items:
          - "Recherche de recettes par ingrédient — un joins(:recipe_ingredients) dans une chaîne de filtres qui existe déjà ; « que puis-je cuisiner avec du poulet ? » ne renvoie rien aujourd'hui"
          - "Prix sur les articles de courses, avec total automatique"
      notifications_automation:
        title: "Notifications et automatisation sortante"
        items:
          - "Les trois types de notification qui ignorent les préférences : rappels de tâche, rappels d'événement et échec de synchronisation d'un calendrier externe sont inconditionnels — trois types sur six"
          - "Webhooks sortants : l'API api/v1 lit et écrit sous jeton mais ne notifie rien, donc aucune automatisation externe (Home Assistant, n8n, IFTTT) ne peut réagir à ce qui se passe dans Hestia"
      first_run_experience:
        title: "Première prise en main : données de démonstration et visite guidée"
        items:
          - "Données de démonstration depuis l'interface : DemoData::Seeder couvre déjà quelque 22 modules mais n'est accessible que par bin/rails demo_data:default"
          - "Visite guidée au premier lancement — la seule critique d'onboarding à retenir des audits supprimés (leur « 5+ étapes » était faux : il y en a deux)"
      personalization:
        title: "Se l'approprier"
        items:
          - "Thèmes personnalisés par foyer : toutes les couleurs passent déjà par une variable CSS derrière l'indirection --brand/--accent, la moitié du travail est faite — il manque la persistance et un sélecteur, sachant que le contrôle de contraste devient alors une contrainte à l'exécution et non plus une vérification de build"
          - "Réordonnancement de la sidebar : SortableJS est déjà câblé aux listes, aux tâches, à la fidélité et au menu, mais pas à la navigation"
      health_records:
        title: "Suivi de santé des personnes"
        items:
          - "Suivi médical humain (traitements, vaccins, cycles) : le motif est intégralement écrit pour Animaux — PetVaccination, PetTreatment, avec rappels de rappel — et absent pour les humains ; Bien-être ne couvre que le poids et les séances"
          - "Profil allergènes par personne, et filtrage des recettes contre lui : AllergenTest existe mais appartient à Bébé (diversification alimentaire), donc une recette d'adulte n'a rien à quoi être confrontée"
          - "À ne pas commencer avant d'avoir tranché trois points : est-ce accroché à un compte, à un profil sans compte (comme BabyProfile), ou à une nouvelle entité personne ; qui dans le foyer peut le lire ; et ce qu'un export de foyer fait d'une donnée de santé"
      marketing_docs:
        title: "Site vitrine & documentation utilisateur"
        items:
          - "Site vitrine public (accueil, une page par module, présentation de Hest.AI)"
          - "Centre de documentation utilisateur par module"
          - "Politique de confidentialité adaptée au contexte auto-hébergé"
      scaling_thresholds:
        title: "Parqué jusqu'à ce qu'une mesure dise le contraire"
        items:
          - "Authentification à deux facteurs — la limitation de débit couvre déjà les trois entrées d'authentification, les cookies sont signés et httponly, et les sessions sont révocables depuis l'interface. Déclencheur : la première instance multi-foyers exposée sur Internet public"
          - "Index pg_trgm / GIN sur la recherche — 28 requêtes ILIKE à joker initial, compromis documenté dans l'en-tête du service et correct en mono-foyer. Déclencheur : une latence de recherche au-delà de 300 ms sur un foyer réel"
          - "Découpage du bundle esbuild — un seul bundle, 50 contrôleurs Stimulus chargés d'emblée, mais seulement trois dépendances tierces (Stimulus, Turbo, sortablejs). Déclencheur : l'ajout d'une dépendance tierce lourde"
      mobile_parity:
        title: "Parité fonctionnelle mobile"
        items:
          - "Écrans pour les 24 modules restants, au-delà de Courses en lecture seule"
          - "Caméra native (scan de code-barres, capture de documents), dictée vocale, notifications push"
          - "Import des contacts du téléphone, mode hors ligne"
          - "Canal temps réel (WebSocket vers Solid Cable) et renouvellement transparent du jeton API"
      cross_household_recipes:
        title: "Communauté de recettes inter-foyers"
        items:
          - "Publier et emprunter des recettes entre foyers Hestia distincts, au-delà du livre privé actuel"
          - "Explicitement hors périmètre V1 — à réévaluer une fois une masse critique de foyers actifs atteinte"
      hestai:
        title: "Hest.AI"
        items:
          - "Généraliser la couche de services par domaine aux modules qui n'en ont pas encore, pour que l'assistant puisse les invoquer comme des outils"
          - "Assistant conversationnel agissant dans l'application sous validation explicite de l'utilisateur, jamais sur les données Bien-être d'un autre membre"
