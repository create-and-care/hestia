fr:
  roadmap:
    show:
      title: Feuille de route
      description: >-
        Ce qui arrive ensuite, puis tout ce qui a déjà été livré, du plus récent au plus
        ancien. Cette page est l'unique source de vérité sur l'avancement de Hestia ; elle remplace
        la Spécification et le Plan d'implémentation d'origine, dont le contenu a été entièrement
        repris ici. Le détail technique de chaque version vit dans CHANGELOG.md.
      status:
        done: Fait
        upcoming: À venir
      release:
        v1: V1
        v2: V2 et plus tard
      today: Aujourd'hui
    milestones:
      foundation:
        title: "Fondations"
        items:
          - "Comptes, foyers et invitations : chaque foyer est un espace clos, rejoint par code d'invitation"
          - "Rôles membre et administrateur"
          - "Inscription, prise en main guidée et tableau de bord d'accueil"
      design_system:
        title: "Identité visuelle et bibliothèque d'interface"
        items:
          - "Une interface unifiée sur l'ensemble de l'application, mode sombre compris"
          - "Bibliothèque de composants consultable directement dans l'application"
      wave_2a:
        title: "Les cinq modules du quotidien"
        items:
          - "Courses, Frigo, Recettes, Tâches et Calendrier"
          - "Mise à jour en temps réel entre les membres d'un même foyer"
      wave_2b:
        title: "Onze modules complémentaires"
        items:
          - "Notes, Anniversaires, Adresses, Prestataires et Fidélité"
          - "Animaux, Véhicules, Cave à vin, Déchets, Bébé et Messages"
      wave_2c:
        title: "Planification et suivi du foyer"
        items:
          - "Menu de la semaine et routines récurrentes"
          - "Extérieur (jardin et piscine), Budget avec répartition automatique, et Documents"
      wave_2d:
        title: "Partage au-delà du foyer"
        items:
          - "Listes de cadeaux partageables par lien public, sans compte pour l'invité"
          - "Cercles : des groupes qui dépassent le cadre du foyer"
          - "Voyage : un contexte transverse regroupant adresses, notes, tâches et courses d'un séjour"
          - "Bien-être : strictement privé, visible du seul membre concerné"
      pdf_export_reordering:
        title: "Export PDF et réorganisation"
        items:
          - "Export PDF de la liste de courses et du mois de calendrier affiché"
          - "Réorganisation par glisser-déposer des courses, des tâches et des cartes de fidélité"
      reminders_notifications:
        title: "Rappels et notifications"
        items:
          - "Rappels d'échéance sur les tâches et les événements"
          - "Récapitulatif quotidien, anniversaires du jour compris"
          - "Centre de notifications et préférences propres à chaque membre"
      external_integrations_v1:
        title: "Intégrations externes"
        items:
          - "Scan de code-barres pour remplir les courses et le frigo"
          - "Recherche d'adresses avec complétion automatique"
          - "Jours fériés France, Belgique et Suisse sur le calendrier"
      reference_catalogs:
        title: "Catalogues de référence"
        items:
          - "Catalogue d'enseignes pour les cartes de fidélité"
          - "Fiches d'entretien prêtes à l'emploi pour les plantes"
      api_and_mobile_skeleton:
        title: "API et première application mobile"
        items:
          - "API ouverte par jeton personnel sur les cinq modules du quotidien"
          - "Première application mobile : connexion et consultation des courses"
      governance:
        title: "Gouvernance et documentation"
        items:
          - "Licence libre AGPLv3, guide de contribution et journal des versions"
          - "Feuille de route publiée dans l'application"
      i18n:
        title: "Application bilingue"
        items:
          - "Hestia disponible en français et en anglais"
          - "Langue choisie par membre, indépendamment du foyer"
      reliability_quality:
        title: "Fiabilité"
        items:
          - "Les pannes remontent dès qu'elles surviennent, plutôt qu'au prochain qui tombe dessus"
          - "Fuseau horaire propre à chaque foyer pour les échéances, les péremptions et les anniversaires"
          - "Chaque module revérifié automatiquement avant chaque livraison"
      external_calendar_sync_real:
        title: "Synchronisation des calendriers externes"
        items:
          - "Connexion des agendas Google et Microsoft"
          - "Compatibilité CalDAV (Apple, Nextcloud, Fastmail)"
          - "Identifiants de calendrier chiffrés au repos"
      api_v1_full:
        title: "API étendue à tous les modules"
        items:
          - "Les 25 modules accessibles depuis l'API"
          - "Confidentialité préservée : Bien-être reste privé, Cercles et Messages limités à leurs membres"
      navigation_settings:
        title: "Navigation et paramètres du foyer"
        items:
          - "Barre latérale repliable, organisée par thème"
          - "Paramètres du foyer réunis en onglets"
      recipe_catalog:
        title: "Catalogue de recettes et découverte"
        items:
          - "95 recettes prêtes à ajouter à son livre en un geste"
          - "Suggestions de recettes à partir du contenu du frigo"
      visual_polish_icons:
        title: "Cohérence visuelle"
        items:
          - "Jeu d'icônes homogène sur toute l'application"
          - "Fil d'Ariane et pagination sur chaque module"
      ui_migration_a11y:
        title: "Interface unifiée et accessibilité"
        items:
          - "Les mêmes contrôles, espacements et couleurs d'une page à l'autre"
          - "Premiers correctifs d'accessibilité"
      global_search:
        title: "Recherche globale"
        items:
          - "Palette de recherche instantanée au clavier (⌘K)"
          - "Couvre l'ensemble des modules activés par le foyer"
      refinement_wave_day1:
        title: "Courses, Calendrier, Tâches, Cadeaux et Cercles approfondis"
        items:
          - "Courses : tri par ordre de rayon et gestion du catalogue de produits"
          - "Calendrier : vues Jour et Semaine, gestion des séries récurrentes, anniversaires intégrés"
          - "Tâches : réorganisation au clavier et tri automatique"
          - "Cadeaux : contrôle de la propriété et de la visibilité des listes"
          - "Cercles : publications avec photo"
      refinement_wave_day2a:
        title: "Frigo, Recettes, Notes, Anniversaires, Adresses et Prestataires approfondis"
        items:
          - "Frigo : photos des plats préparés et rangement par emplacement"
          - "Recettes : mode cuisine avec écran maintenu allumé, photos et filtres par catégorie"
          - "Notes : mise en forme enrichie, filtres et liens"
          - "Anniversaires : vue calendrier"
          - "Adresses et Prestataires : photos, types personnalisables et import"
      refinement_wave_day2b:
        title: "Fidélité, Animaux, Véhicules, Cave à vin, Déchets, Bébé et Messages approfondis"
        items:
          - "Fidélité : codes-barres et QR affichés en plein écran pour le passage en caisse"
          - "Animaux, Véhicules et Cave à vin : édition complète et photos"
          - "Déchets : collectes reportées dans le calendrier"
          - "Bébé : minuteur d'allaitement et de biberon"
          - "Messages : confidentialité et mise à jour en temps réel"
      refinement_wave_day3a:
        title: "Menu, Routines, Extérieur, Budget, Documents, Voyage et Bien-être approfondis"
        items:
          - "Menu : réorganisation et export direct vers les courses"
          - "Routines : historique des réalisations"
          - "Budget : suivi rattaché aux voyages"
          - "Documents : lecteur PDF intégré et partage"
          - "Voyage : onglets à la carte et menu isolé par séjour"
          - "Bien-être : courbe de poids et historique complet"
      refinement_wave_day3b:
        title: "Gestion du foyer, apparence et navigation"
        items:
          - "Gestion des membres : quitter, exclure, promouvoir, et révoquer une session active"
          - "Mode sombre appliqué à l'ensemble de l'application"
          - "Notifications cliquables menant directement à leur source"
      account_privacy:
        title: "Compte utilisateur & confidentialité"
        items:
          - "Suppression du compte utilisateur"
          - "Export des données personnelles, pour la portabilité même en auto-hébergement"
          - "Réinitialisation des données module par module : aujourd'hui c'est tout ou rien (supprimer le foyer), et désactiver un module laisse ses lignes intactes et invisibles"
      security_audit_trail:
        title: "Un journal de sécurité, pas un journal de surveillance"
        items:
          - "Connexions, sessions révoquées, jetons d'API créés et supprimés, changements de rôle, exports et suppressions de foyer — la seule trace de tout cela aujourd'hui est api_tokens.last_used_at"
          - "Visible des administrateurs et volontairement étroit : il enregistre qui détenait les clés, pas qui a modifié la liste de courses — la réponse côté foyer à cette question, c'est le fil d'activité de « Tableau de bord : activité & export »"
          - "Aucune statistique de complétion par membre : une maison est un lieu où l'on se coordonne, pas un lieu où l'on est noté"
      household_activity_export:
        title: "Tableau de bord : activité & export"
        items:
          - "Fil d'activité du foyer (qui a fait quoi, quand), tourné vers le foyer et distinct du journal de sécurité réservé aux administrateurs"
          - "Export des données du foyer au format JSON/CSV"
      public_route_hardening:
        title: "Sécurité des liens publics"
        items:
          - "Listes de cadeaux publiques protégées contre les abus"
          - "Jetons d'API à durée de vie limitée, 90 jours par défaut"
          - "Contrôle d'accessibilité automatisé sur l'ensemble des pages, dans les deux thèmes"
      security_performance_hardening:
        title: "Sécurité et performance"
        items:
          - "Politique de sécurité du contenu appliquée, et HTTPS forçable sans casser l'accès en réseau local"
          - "Modules désactivés fermés côté API comme côté web"
          - "Tableau de bord, calendrier et listes sensiblement plus rapides"
      reference_catalog_growth:
        title: "Enrichir les catalogues & les automatismes"
        items:
          - "Étendre le catalogue de fiches Extérieur au-delà des 6 fiches de départ"
          - "Étendre le catalogue de fidélité au-delà de la dizaine de départ"
          - "Fusion intelligente des ingrédients (doublons, conversion d'unités) lors de l'ajout d'une recette aux courses"
      design_system_measured:
        title: "Design system : les écarts corrigés"
        items:
          - "Contrastes, tailles de cible et typographie repris d'après une mesure sur toutes les pages"
          - "Documentation du design system utilisable sur mobile"
          - "Écrans de chargement à la place des zones vides"
      i18n_guardrails:
        title: "Dates et traductions fiables"
        items:
          - "Dates affichées au format attendu par la langue du lecteur"
          - "Contrôle automatique refusant toute traduction manquante"
      budget_expense_chart:
        title: "Voir où va l'argent"
        items:
          - "Un graphique en barres sur la page Budget, montrant la répartition des charges par catégorie, à côté des totaux revenus/charges/épargne"
      fridge_item_quantity_unit:
        title: "Suivre la quantité au frigo"
        items:
          - "Quantité et unité sur les articles du frigo, reportées automatiquement lors du passage d'un article entre la liste de courses et le frigo, dans les deux sens"
      today_view:
        title: "Aujourd'hui : une page, une question"
        items:
          - "Une page unique qui répond à « qu'est-ce qu'il y a à faire aujourd'hui ? » : tâches en retard, rappels de vaccins et soins des plantes, aliments qui expirent bientôt, et les événements, anniversaires, collectes de déchets et jours de voyage du jour"
          - "Triée par heure de la journée plutôt qu'éclatée entre les encarts de chaque module"
      pwa:
        title: "Application installable"
        items:
          - "Hestia s'installe sur mobile et sur bureau comme une application"
          - "Icônes et couleur de thème propres à Hestia"
          - "Page hors-ligne lorsque la connexion manque"
      shared_link_controls:
        title: "Maîtrise des liens partagés"
        items:
          - "Expiration et mot de passe sur les partages publics de liste de cadeaux : un lien partagé une fois vaut aujourd'hui pour toujours"
          - "Mode invité à durée limitée, pour laisser voir une liste de courses à quelqu'un sans compte Hestia"
      household_logistics:
        title: "Logistique du foyer"
        items:
          - "Factures récurrentes dans Budget : un loyer se resaisit chaque mois alors que le moteur de récurrence et les rappels existent tous les deux"
          - "Inventaire des biens (photo, valeur, date d'achat, garantie), pour l'assurance et la revente"
          - "Calendrier des vacances scolaires françaises (zones A/B/C) — les jours fériés sont couverts, pas ce qui structure l'année d'un foyer avec enfants"
          - "Détection des doublons à l'ajout aux courses, et suggestions tirées de l'historique d'achat déjà en base"
      quick_capture:
        title: "Capture rapide, depuis n'importe où"
        items:
          - "Un champ de capture accessible depuis n'importe quelle page (icône dans la barre latérale) enregistre toute phrase comme note en un geste"
          - "Si le texte ressemble à une date, une suggestion propose de créer une tâche à la place ; s'il correspond à un produit déjà dans votre catalogue, elle propose de l'ajouter aux courses"
          - "La note reste toujours enregistrée, suggestion acceptée ou non — rien n'est rangé sans un geste explicite"
      wired_patterns:
        title: "Photos et réactions dans les messages"
        items:
          - "Une photo peut désormais être jointe à un message, comme c'était déjà possible sur les publications de Cercle"
          - "Réagissez à un message avec un emoji (👍 ❤️ 😂 🎉 😮), visible par tous les participants de la conversation"
      tasks_and_recurrence:
        title: "Tâches et récurrences, en profondeur"
        items:
          - "Sous-tâches, priorité et tags sur les tâches — aujourd'hui atténué par les catégories kanban, un emoji et un statut d'échéance dérivé"
          - "Récurrences de niveau RRULE : le service Recurrence couvre quotidien/hebdomadaire/mensuel/annuel et rien d'autre — pas de « 2e mardi », pas de nombre d'occurrences, pas de règle multi-jours"
      shared_responsibility:
        title: "À qui le tour"
        items:
          - "Un responsable sur les tâches, les routines, les soins des plantes et ceux des animaux : tout est à l'échelle du foyer aujourd'hui, donc rien ne distingue « quelqu'un devrait » de « tu devrais »"
          - "Rotation automatique entre les membres semaine après semaine, en réutilisant le service Recurrence qui pilote déjà les tâches répétées"
          - "Répond à « à qui le tour ? » sans jamais répondre à « qui en fait le moins ? »"
      cooking_and_shopping:
        title: "Cuisine et courses, au-delà de la base"
        items:
          - "Recherche de recettes par ingrédient — un joins(:recipe_ingredients) dans une chaîne de filtres qui existe déjà ; « que puis-je cuisiner avec du poulet ? » ne renvoie rien aujourd'hui"
          - "Prix sur les articles de courses, avec total automatique"
          - "Ce que coûte une recette avant de la cuisiner, une fois que les articles de courses portent un prix — l'estimation est la raison de leur en donner un"
      backup_and_restore:
        title: "Des sauvegardes qu'un foyer peut vraiment restaurer"
        items:
          - "Sauvegardes planifiées vers un chemin local ou S3, sur Solid Queue comme toute autre tâche récurrente — il n'existe aujourd'hui aucun outillage de sauvegarde dans le dépôt, ni tâche rake, ni pg_dump documenté"
          - "Restauration depuis l'interface, et une restauration qui a été éprouvée : une sauvegarde jamais restaurée n'est pas une sauvegarde"
          - "Fichiers téléversés inclus, pas seulement la base — les pièces jointes Active Storage vivent en dehors du dump"
      instance_operations:
        title: "Savoir que l'instance va bien"
        items:
          - "Une page de santé qui aille plus loin que /up, lequel prouve seulement que Rails a démarré : base de données, stockage, tâches de fond, courriel, HTTPS, disque, sauvegardes et clés de chiffrement OAuth, chacun avec quoi faire quand il passe au rouge"
          - "Une version que l'hébergeur puisse lire — il n'y a ni constante VERSION, ni étiquette git, ni version affichée dans l'application, donc « quelle Hestia est-ce que je fais tourner ? » n'a aujourd'hui pas de réponse"
          - "Un docker-compose qui démarre Hestia et non PostgreSQL seul, et un config/deploy.yml qui ne soit plus l'échafaudage Kamal intact pointant encore vers 192.168.0.1"
      api_as_a_product:
        title: "L'API traitée comme un produit"
        items:
          - "Une description OpenAPI générée : 29 contrôleurs sérialisent via as_json(only:) et rien ne décrit la surface, si bien que le client mobile et tout tiers lisent le Ruby pour en deviner la forme"
          - "Api::V1::BaseController épingle Current.household à households.first, donc un membre de deux foyers ne peut jamais atteindre le second — et les fixtures, un membership par utilisateur, ne peuvent pas l'attraper"
          - "Limitation de débit sur les jetons (les trois points d'entrée d'authentification du web en ont une, l'API aucune), clés d'idempotence pour les écritures rejouées, et un décompte total sur les réponses paginées"
          - "Des écritures au-delà de la poignée qui existe : la surface est essentiellement en lecture, sans update ni destroy nulle part"
      notifications_automation:
        title: "Notifications et automatisation sortante"
        items:
          - "Les trois types de notification qui ignorent les préférences : rappels de tâche, rappels d'événement et échec de synchronisation d'un calendrier externe sont inconditionnels — trois types sur six"
          - "Webhooks sortants : l'API api/v1 lit et écrit sous jeton mais ne notifie rien, donc aucune automatisation externe (Home Assistant, n8n, IFTTT) ne peut réagir à ce qui se passe dans Hestia"
          - "Un flux d'événements interne, introduit en même temps que les webhooks qui en sont le premier consommateur plutôt qu'avant eux : aucun publish/subscribe n'existe aujourd'hui, et une infrastructure sans consommateur vieillit mal"
          - "Des notifications sur lesquelles on peut agir : la table notifications ne porte aucune colonne d'action, donc « votre contrôle technique approche » ne peut pas porter aussi « rappelle-moi » ou « marquer comme fait »"
          - "Notifications push : l'écouteur push du service worker est écrit et mis en commentaire, et rien n'est envoyé par courriel non plus — le seul mailer de l'application envoie les réinitialisations de mot de passe"
      first_run_experience:
        title: "Première prise en main : données de démonstration et visite guidée"
        items:
          - "Données de démonstration depuis l'interface : DemoData::Seeder couvre déjà quelque 22 modules mais n'est accessible que par bin/rails demo_data:default"
          - "Visite guidée au premier lancement — la seule critique d'onboarding à retenir des audits supprimés (leur « 5+ étapes » était faux : il y en a deux)"
      personalization:
        title: "Se l'approprier"
        items:
          - "Thèmes personnalisés par foyer : toutes les couleurs passent déjà par une variable CSS derrière l'indirection --brand/--accent, la moitié du travail est faite — il manque la persistance et un sélecteur, sachant que le contrôle de contraste devient alors une contrainte à l'exécution et non plus une vérification de build"
          - "Réordonnancement de la sidebar : SortableJS est déjà câblé aux listes, aux tâches, à la fidélité et au menu, mais pas à la navigation"
          - "Séries et jalons dans CelebrationMoment : le composant gère déjà les types :streak et :milestone, mais aucun modèle de données ne suit une série maintenue ou un jalon atteint — seuls les anniversaires sont branchés aujourd'hui"
      object_graph:
        title: "Tout ce qu'il y a dans la maison, relié"
        items:
          - "Une table de liaison du foyer joignant n'importe quel enregistrement à n'importe quel autre : une vingtaine de clés étrangères typées traversent déjà les frontières de modules, plus un documentable polymorphe, et pourtant rien ne permet à un véhicule de réunir ses documents, ses dépenses, ses tâches d'entretien et son rappel de contrôle technique sur une seule page"
          - "Une liste blanche explicite de ce qui peut être relié, gardée comme ModuleGating garde les contrôleurs — un test qui parcourt les modèles et échoue sur tout modèle qui n'est ni listé ni exclu"
          - "Les deux extrémités vérifiées comme appartenant au même foyer, et les quatre déviations documentées (Cercles, Cadeaux, Voyage, Bien-être) exclues nommément plutôt que par accident"
          - "Les liens vers un module désactivé restent masqués, exactement comme le font déjà les résultats de recherche"
      granular_permissions:
        title: "Des rôles au-delà d'administrateur et membre"
        items:
          - "L'appartenance est un booléen aujourd'hui — administrateur ou non — ce qui fait d'un calendrier partagé et d'un budget partagé la même décision de confiance"
          - "Lecture et écriture module par module, pour qu'un adolescent puisse tenir le calendrier sans tenir les documents"
          - "Un profil enfant (tâches, routines, argent de poche, son propre calendrier), avec les modules qu'il ne doit pas voir simplement absents, comme le sont déjà les modules désactivés"
      document_intelligence:
        title: "Des documents qui se lisent eux-mêmes"
        items:
          - "Extraction du texte au téléversement — fournisseur, dates, montant, échéance — pour qu'une attestation d'assurance photographiée cesse d'être une pièce jointe opaque"
          - "L'échéance extraite devient un rappel et le montant une dépense : l'extraction n'est pas la fonctionnalité, le câblage l'est"
          - "Une décision d'abord : un moteur auto-hébergé tient la promesse qu'aucune donnée du foyer ne quitte l'instance, un moteur hébergé lit mieux — une application auto-hébergée ne peut pas choisir le second en silence"
      health_records:
        title: "Suivi de santé des personnes"
        items:
          - "Suivi médical humain (traitements, vaccins, cycles) : le motif est intégralement écrit pour Animaux — PetVaccination, PetTreatment, avec rappels de rappel — et absent pour les humains ; Bien-être ne couvre que le poids et les séances"
          - "Profil allergènes par personne, et filtrage des recettes contre lui : AllergenTest existe mais appartient à Bébé (diversification alimentaire), donc une recette d'adulte n'a rien à quoi être confrontée"
          - "À ne pas commencer avant d'avoir tranché trois points : est-ce accroché à un compte, à un profil sans compte (comme BabyProfile), ou à une nouvelle entité personne ; qui dans le foyer peut le lire ; et ce qu'un export de foyer fait d'une donnée de santé"
      automation_rules:
        title: "Quand, si, alors"
        items:
          - "Des règles écrites par le foyer au-dessus du flux d'événements qu'introduit le jalon webhooks : un article du frigo qui expire dans deux jours, une facture ajoutée, un voyage qui commence demain"
          - "Ces mêmes événements alimentent déjà les notifications, le fil d'activité et les webhooks sortants, si bien que le moteur de règles en est le troisième consommateur plutôt qu'un mécanisme parallèle"
          - "Chaque règle montre ce qu'elle aurait fait avant d'avoir le droit de le faire"
      marketing_docs:
        title: "Site vitrine & documentation utilisateur"
        items:
          - "Site vitrine public (accueil, une page par module, présentation de Hest.AI)"
          - "Centre de documentation utilisateur par module"
          - "Politique de confidentialité adaptée au contexte auto-hébergé"
          - "Allemand, espagnol et italien : la mécanique a fait ses preuves — un job de CI refuse une clé manquante et refuse aussi une clé inutilisée — donc ce qui reste est de la traduction, pas de la plomberie"
      scaling_thresholds:
        title: "Parqué jusqu'à ce qu'une mesure dise le contraire"
        items:
          - "Authentification à deux facteurs — la limitation de débit couvre déjà les trois entrées d'authentification, les cookies sont signés et httponly, et les sessions sont révocables depuis l'interface. Déclencheur : la première instance multi-foyers exposée sur Internet public"
          - "Index pg_trgm / GIN sur la recherche — 28 requêtes ILIKE à joker initial, compromis documenté dans l'en-tête du service et correct en mono-foyer. Déclencheur : une latence de recherche au-delà de 300 ms sur un foyer réel"
          - "Découpage du bundle esbuild — un seul bundle, 50 contrôleurs Stimulus chargés d'emblée, mais seulement trois dépendances tierces (Stimulus, Turbo, sortablejs). Déclencheur : l'ajout d'une dépendance tierce lourde"
          - "Recherche sémantique sur le foyer, pour que « quand expire l'assurance de la voiture ? » soit répondu plutôt que trouvé par correspondance de mots. Déclencheur : pg_trgm livré et toujours insuffisant"
      offline_sync:
        title: "La liste de courses fonctionne sans réseau"
        items:
          - "Le sous-sol d'un supermarché est le seul endroit où l'application doit fonctionner hors ligne, et le service worker ne met en cache qu'une page hors ligne — aucune donnée, aucune écriture mise en attente"
          - "Stockage local et file de synchronisation dans le client Flutter, qui compte aujourd'hui 285 lignes et un seul écran en lecture seule"
          - "Les règles de conflit tranchées avant tout le reste : des versions sur les enregistrements, des écritures idempotentes, et une réponse pour deux personnes qui cochent le même article"
      mobile_parity:
        title: "Parité fonctionnelle mobile"
        items:
          - "Écrans pour les 24 modules restants, au-delà de Courses en lecture seule"
          - "Caméra native (scan de code-barres, capture de documents), dictée vocale, notifications push"
          - "Import des contacts du téléphone"
          - "Canal temps réel (WebSocket vers Solid Cable) et renouvellement transparent du jeton API"
      cross_household_recipes:
        title: "Communauté de recettes inter-foyers"
        items:
          - "Publier et emprunter des recettes entre foyers Hestia distincts, au-delà du livre privé actuel"
          - "Explicitement hors périmètre V1 — à réévaluer une fois une masse critique de foyers actifs atteinte"
      hestai:
        title: "Hest.AI"
        items:
          - "Généraliser la couche de services par domaine aux modules qui n'en ont pas encore, pour que l'assistant puisse les invoquer comme des outils"
          - "Assistant conversationnel agissant dans l'application sous validation explicite de l'utilisateur, jamais sur les données Bien-être d'un autre membre"
