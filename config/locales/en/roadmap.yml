en:
  roadmap:
    show:
      title: Roadmap
      description: >-
        The project's timeline, from v0 to the latest shipped work — and what's next. This
        page is now the single source of truth on Hestia's progress; it replaces the original
        Specification and Implementation Plan documents, whose content has been fully folded in
        here. Precise version history lives in CHANGELOG.md.
      status:
        done: Done
        upcoming: Upcoming
      today: Today
    milestones:
      foundation:
        title: "Foundation"
        items:
          - "User, Session, Household, Membership (member/admin roles, unique invite code)"
          - "Multi-household scoping (Current.household, the HouseholdScoped concern)"
          - "Sign-up, onboarding (create or join a household via code), dashboard"
      design_system:
        title: "Ui:: component library"
        items:
          - "About fifty shadcn/ui-style ViewComponents (buttons, dialogs, calendar, charts, combobox...) exposed on /design-system"
          - "Tailwind v4 foundation and design tokens (semantic colors, dark mode)"
      wave_2a:
        title: "Wave 2.a — Priority modules"
        items:
          - "Shopping, Fridge, Recipes, Tasks, Calendar: model, controller, views, real-time"
          - "Per-domain services (Courses::AddItem, Frigo::AddItem, Tasks::CreateTask, Calendar::CreateEvent...)"
      wave_2b:
        title: "Wave 2.b — Satellite modules"
        items:
          - "11 modules: Notes, Birthdays, Addresses, Service Providers, Loyalty, Pets, Vehicles, Wine Cellar, Waste, Baby, Messages"
      wave_2c:
        title: "Wave 2.c — Richer business logic"
        items:
          - "Menu (meal planning), Routines (recurrence engine shared with Calendar)"
          - "Outdoor (garden and pools), Budget (automatic split calculation), Documents (storage via Active Storage)"
      wave_2d:
        title: "Wave 2.d — Architecture deviations"
        items:
          - "Gifts: unauthenticated public sharing via token (g/:token)"
          - "Circles: independent of the household, group users beyond it"
          - "Trip: cross-cutting sub-context (trip_id) on Addresses, Notes, Tasks, Shopping"
          - "Wellbeing: strict per-user scoping, never per household — not even an admin can access it"
      pdf_export_reordering:
        title: "PDF export & reordering"
        items:
          - "PDF export of the shopping list and the displayed calendar month (Prawn)"
          - "Drag-and-drop reordering on shopping items, tasks, and loyalty cards"
      reminders_notifications:
        title: "Reminders & notifications"
        items:
          - "Notification, NotificationPreference, TaskReminder, EventReminder"
          - "Solid Queue jobs: Reminders::DeliverDue (due dates) and Reminders::DailyDigest (daily recap, including today's birthdays)"
          - "Unread-notifications badge and a per-user preferences page"
      external_integrations_v1:
        title: "External integrations"
        items:
          - "Open Food Facts for barcode scanning (Shopping, Fridge)"
          - "Nominatim geocoding for address search"
          - "France / Belgium / Switzerland public holidays on Calendar, country configurable per household"
      reference_catalogs:
        title: "Reference catalogs"
        items:
          - "Loyalty brand catalog (about ten to start, Loyalty)"
          - "Plant care-sheet catalog (6 sheets to start, Outdoor)"
      api_and_mobile_skeleton:
        title: "API api/v1 & mobile skeleton"
        items:
          - "ApiToken, Api::V1::BaseController, REST endpoints for Shopping, Fridge, Recipes, Tasks, Calendar"
          - "Flutter client skeleton: login screen, read-only Shopping"
          - "External calendar sync: first scaffold (Google/Microsoft/CalDAV), the real flow not yet wired up"
      governance:
        title: "Governance & documentation"
        items:
          - "LICENSE (AGPLv3), README, CONTRIBUTING, CHANGELOG"
          - "First version of the in-app Roadmap page"
      i18n:
        title: "Full internationalization"
        items:
          - "English by default, per-user language preference (French available)"
          - "All 25 modules migrated to I18n"
      reliability_quality:
        title: "Reliability & quality"
        items:
          - "SimpleCov (test coverage), Bullet (N+1 query detection), Sentry (production error tracking)"
          - "mission_control-jobs: Solid Queue admin UI at /jobs, closed by default"
          - "Explicit per-household time zone for day-sensitive calculations (due dates, expiry, birthdays)"
          - "Real Capybara system tests and 77 new test files closing the coverage gap"
      external_calendar_sync_real:
        title: "Real external calendar sync"
        items:
          - "Full OAuth2 flow for Google and Microsoft, with automatic refresh of an expired token"
          - "CalDAV (Apple, Nextcloud, Fastmail...) via a genuine REPORT calendar-query request"
          - "Access tokens encrypted at rest (Active Record Encryption)"
      api_v1_full:
        title: "API api/v1 extended to all 25 modules"
        items:
          - "The 20 remaining modules exposed: Notes, Birthdays, Addresses, Service Providers, Loyalty, Pets, Vehicles, Wine Cellar, Waste, Baby, Messages, Menu, Routines, Outdoor, Budget, Documents, Gifts, Circles, Trip, Wellbeing"
          - "Scoping honored for the special cases: Circles by membership (not household), Wellbeing by user, Messages by conversation participant"
      navigation_settings:
        title: "Navigation & household settings"
        items:
          - "Collapsible sidebar, grouped by theme"
          - "Household settings consolidated into tabs: general, members, notifications, API, sessions, modules, roadmap"
      recipe_catalog:
        title: "Recipe catalog & discovery"
        items:
          - "Shared recipe catalog ready to clone into your own book (up to 95 hand-authored recipes)"
          - "Recipe suggestions based on the fridge's contents"
      visual_polish_icons:
        title: "Cross-cutting visual polish"
        items:
          - "Replaced emoji icons with the Lucide icon library throughout the app"
          - "Consistent breadcrumb and pagination on every module page"
      ui_migration_a11y:
        title: "Full Ui:: migration & accessibility"
        items:
          - "Every view in the app migrated to Ui:: components, with dedicated tests"
          - "First accessibility fixes and a locale-switcher correction"
      global_search:
        title: "⌘K global search"
        items:
          - "⌘K command palette replacing the sidebar's nav filter"
          - "Covers every module enabled for the household"
      refinement_wave_day1:
        title: "Refinement wave — day 1: Shopping, Calendar, Tasks, Gifts, Circles"
        items:
          - "Shopping: sorting by real aisle order, catalog management tools"
          - "Calendar: Day/Week views, single-occurrence vs series editing, birthdays shown"
          - "Tasks: delete confirmations, keyboard reordering, auto-sort"
          - "Gifts: secured public reservation cancellation, list ownership and visibility"
          - "Circles: photo posts, correctness bug fixes"
      refinement_wave_day2a:
        title: "Refinement wave — day 2: Fridge, Recipes, Notes, Birthdays, Addresses, Service Providers"
        items:
          - "Fridge: prepared-dish photos, location tabs, delete confirmations"
          - "Recipes: real cook mode (keeps the screen awake), photos, category filtering"
          - "Notes: filters, richer formatting, links"
          - "Birthdays: calendar view, hardening, accessibility"
          - "Addresses: photo, accessibility, interconnections with other modules"
          - "Service Providers: customizable types, accessibility, import"
      refinement_wave_day2b:
        title: "Refinement wave — day 2: Loyalty, Pets, Vehicles, Wine Cellar, Waste, Baby, Messages"
        items:
          - "Loyalty: real detected barcodes/QR codes, full-screen kiosk mode at checkout"
          - "Pets, Vehicles, Wine Cellar: editing, photo, real-time, an N+1 query fix"
          - "Waste: editing, a Calendar link, visual badges"
          - "Baby: a real feeding timer, editing, interconnections"
          - "Messages: a real-time fix, privacy, interconnections"
      refinement_wave_day3a:
        title: "Refinement wave — day 3: Menu, Routines, Outdoor, Budget, Documents, Trip, Wellbeing"
        items:
          - "Menu: reordering, editing, direct export to Shopping"
          - "Routines: completion history, accessibility, dark mode"
          - "Outdoor: editing, history, accessibility, dark mode"
          - "Budget: editing, a Trip link, accessibility, dark mode"
          - "Documents: a built-in PDF viewer, sharing, interconnections"
          - "Trip: à-la-carte tabs, per-stay Menu isolation, editing"
          - "Wellbeing: a weight chart, editing, full history, accessibility"
      refinement_wave_day3b:
        title: "Refinement wave — day 3: Foundation, Design system, Navigation"
        items:
          - "Foundation: dashboard widgets, member/household management (leave, remove, promote, delete), revocable active sessions"
          - "Foundation: hardening — an 8-character minimum password, configurable API token expiration"
          - "Design system: dark-mode tokens applied app-wide, the last hardcoded strings translated"
          - "Navigation: extended search coverage, notifications clickable to their source, the Roadmap page rebuilt as a timeline"
      account_privacy:
        title: "User account & privacy"
        items:
          - "User account deletion"
          - "Personal-data export, for portability even when self-hosted"
          - "Per-module data reset: today it is all or nothing (delete the household), and turning a module off leaves its rows in place and invisible"
      household_activity_export:
        title: "Dashboard: activity & export"
        items:
          - "A household activity feed (who did what, when)"
          - "Household data export in JSON/CSV"
      public_route_hardening:
        title: "Public route hardening"
        items:
          - "Rate limiting on the public gift list (g/:token): separate browse and write limits, the latter on reservation, plus a 429 page in the site's own dress"
          - "No more never-expiring API token: three durations to choose from, 90 days by default"
          - "Automated accessibility auditing: bin/rails visual:check measures contrast, touch-target size and font size across 273 routes × 2 themes × 2 widths, and test/lib/ carries the contrast and accessibility tests"
      security_performance_hardening:
        title: "Security & measured performance"
        items:
          - "A Content-Security-Policy that is actually sent (it was commented out in full), with a per-request nonce on script-src"
          - "force_ssl / assume_ssl switchable through FORCE_SSL, without breaking plain-HTTP access on a home network"
          - "Disabled modules now closed on the JSON API too: one mapping shared by the web and the API, and a test that walks the routes so no controller stays unclassified"
          - "Open Food Facts and Nominatim lookups cached — the first uses of Rails.cache, setting the key and TTL conventions"
          - "Dashboard filtered in SQL: every widget asks the database for the five rows it shows instead of loading the whole relation"
          - "Recurrence expansion bounded by the date window rather than by the age of the series"
          - "Eager loading on the lists that lacked it, enumerated by making Bullet fail the test suite (BULLET_RAISE=1)"
      reference_catalog_growth:
        title: "Grow the catalogs & the automation"
        items:
          - "Expand the Outdoor plant reference catalog beyond the 6 starter sheets"
          - "Expand the Loyalty brand catalog beyond the starter dozen"
          - "Smart ingredient merging (duplicates, unit conversion) when adding a recipe to shopping"
      design_system_measured:
        title: "Design system: the measured gaps"
        items:
          - "The visual:check report re-run across 273 routes × 2 themes × 2 widths, and fixed from its numbers rather than from an impression"
          - "Ui::ItemComponent put back on the 4px grid without moving every list in the app: a height floor keeps the common row pixel-identical"
          - "A named z-index scale (sticky, floating, overlay, toast): the stacking order was twelve hand-picked numbers and written down nowhere"
          - "Loading skeletons in the lazy turbo-frames, with a screen-reader label — a grey shape says nothing"
          - "The design-system documentation made usable on mobile: it overflowed by 80px at 390px, on the very pages that describe the type scale"
          - "icon: and icon_position: on Ui::ButtonComponent, with the glyph sized from the button"
      i18n_guardrails:
        title: "Internationalization: guardrails instead of discipline"
        items:
          - "date/time format blocks in both locales: none existed, and the l() calls were running on rails-i18n's defaults"
          - "51 display strftime calls migrated to l() — they hard-coded \"%d/%m/%Y\", so an English reader saw 07/08/2026 for 7 August and read 8 July"
          - "bin/rails i18n:check (and its CI job) fails on a missing translation and on any key present in only one of the two locales"
          - "A test refuses any new display strftime and pins that a numeric date really does read differently in English and in French"
      pwa:
        title: "Installable app (PWA)"
        items:
          - "Manifest and service worker wired up: routes, the layout link, and a theme colour and square icons in place of the Rails template's own values"
          - "192/512 icons and a maskable variant generated from the logo, plus a vector icon replacing the red circle that had been serving as the favicon"
          - "An offline page served by the worker when a navigation fails — the only cached resource, since serving a stale dashboard would be worse than serving nothing"
          - "Installable on mobile and desktop while waiting for full Flutter client parity"
      shared_link_controls:
        title: "Control over shared links"
        items:
          - "Expiry and a password on public gift-list shares: a link shared once is currently good forever"
          - "A time-limited guest mode, to let someone without a Hestia account see a shopping list"
      household_logistics:
        title: "Household logistics"
        items:
          - "Recurring bills in Budget: rent is re-entered by hand every month, while both the recurrence engine and the reminders already exist"
          - "A belongings inventory (photo, value, purchase date, warranty), for insurance and resale"
          - "French school-holiday calendar (zones A/B/C) — public holidays are covered, what shapes a family's year is not"
          - "Duplicate detection when adding to the shopping list, and suggestions drawn from the purchase history already in the database"
      wired_patterns:
        title: "Patterns already in the repo, finally wired up"
        items:
          - "Attachments and reactions on messages: CirclePost already carries has_one_attached :photo and a complete CirclePostReaction model with its controller and routes — the pattern is written, tested and shipped, it is simply not applied to messages"
          - "Charts in Budget: Ui::ChartComponent already runs in Pools and Wellbeing, while budget/show has nothing but a progress bar"
          - "quantity and unit on fridge items: shopping list items carry both, fridge items carry neither, and the two Fridge↔Shopping services already cross that boundary and drop the information"
      tasks_and_recurrence:
        title: "Tasks and recurrence, in depth"
        items:
          - "Subtasks, priority and tags on tasks — mitigated today by kanban categories, an emoji and a derived due status"
          - "RRULE-grade recurrence: the Recurrence service covers daily/weekly/monthly/yearly and nothing else — no \"second Tuesday\", no occurrence count, no multi-day rule"
      cooking_and_shopping:
        title: "Cooking and shopping, past the basics"
        items:
          - "Recipe search by ingredient — a joins(:recipe_ingredients) in a filter chain that already exists; \"what can I cook with chicken?\" returns nothing today"
          - "A price on shopping list items, with a running total"
      notifications_automation:
        title: "Notifications and outbound automation"
        items:
          - "The three notification types that ignore preferences: task reminders, event reminders and external calendar sync failures are unconditional — three of the six types"
          - "Outbound webhooks: the api/v1 surface reads and writes under a token but notifies nothing, so no external automation (Home Assistant, n8n, IFTTT) can react to anything happening in Hestia"
      first_run_experience:
        title: "First run: demo data and a guided tour"
        items:
          - "Demo data from the interface: DemoData::Seeder already covers some 22 modules but is reachable only through bin/rails demo_data:default"
          - "A guided first-run tour — the one onboarding criticism worth keeping from the deleted audits (their \"5+ steps\" claim was wrong: there are two)"
      personalization:
        title: "Making it yours"
        items:
          - "Per-household custom themes: every colour already goes through a CSS variable behind the --brand/--accent indirection, so half the work is done — what is missing is persistence and a picker, knowing that contrast checking then becomes a runtime constraint rather than a build-time check"
          - "Sidebar reordering: SortableJS is already wired to lists, tasks, loyalty and the menu, just not to the navigation"
      health_records:
        title: "Health records for people"
        items:
          - "Human medical tracking (treatments, vaccinations, cycles): the pattern is written in full for Pets — PetVaccination, PetTreatment, with booster reminders — and absent for people; Wellbeing covers weight and sessions only"
          - "A per-person allergen profile, and recipe filtering against it: AllergenTest exists but belongs to Baby (food diversification), so an adult recipe has nothing to be checked against"
          - "Not to be started before three decisions are made: whether it hangs off an account, off a profile without one (as BabyProfile does), or off a new person entity; who in the household may read it; and what a household export does with health data"
      marketing_docs:
        title: "Marketing site & user documentation"
        items:
          - "A public marketing site (home page, one page per module, a Hest.AI presentation page)"
          - "A per-module user documentation hub"
          - "A privacy policy suited to the self-hosted context"
      scaling_thresholds:
        title: "Parked until a measurement says otherwise"
        items:
          - "Two-factor authentication — rate limiting already covers the three authentication entry points, cookies are signed and httponly, and sessions are revocable from the interface. Trigger: the first multi-household instance exposed on the public internet"
          - "pg_trgm / GIN indexing on search — 28 leading-wildcard ILIKE queries, a trade-off documented in the service header and correct for a single household. Trigger: search latency above 300 ms on a real household"
          - "Splitting the esbuild bundle — one bundle, 50 Stimulus controllers loaded up front, but only three third-party dependencies (Stimulus, Turbo, sortablejs). Trigger: adding a heavy third-party dependency"
      mobile_parity:
        title: "Mobile functional parity"
        items:
          - "Screens for the 24 remaining modules, beyond read-only Shopping"
          - "Native camera (barcode scanning, document capture), voice dictation, push notifications"
          - "Phone contact import, offline mode"
          - "A real-time channel (WebSocket to Solid Cable) and transparent API token renewal"
      cross_household_recipes:
        title: "Cross-household recipe community"
        items:
          - "Publish and draw from recipes across distinct Hestia households, beyond today's private book"
          - "Explicitly out of V1 scope — to reassess once a critical mass of active households is reached"
      hestai:
        title: "Hest.AI"
        items:
          - "Generalize the per-domain service layer to the modules that don't have one yet, so the assistant can invoke them as tools"
          - "A conversational assistant acting inside the app under the user's explicit approval, never on another member's Wellbeing data"
