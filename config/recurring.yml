# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  # Rappels ponctuels Tâches/Calendrier (CDC §9.2, §9.3) : livraison à échéance.
  deliver_due_reminders:
    class: Reminders::DeliverDueJob
    queue: default
    schedule: every 5 minutes

  # Notifications récurrentes Frigo/Anniversaires (CDC §9.4, §10.2).
  daily_notifications_digest:
    class: Reminders::DailyDigestJob
    queue: default
    schedule: every day at 7:00am
