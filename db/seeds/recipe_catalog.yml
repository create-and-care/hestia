  - 1 œuf
  - 50 g de beurre
  - 1 cs de vinaigre balsamique noir
  - sel et poivre
  steps:
  - Épépiner le poivron et le couper en lanières avec la sucrine. Couper le concombre
    en fines demi-lunes et égoutter les pois chiches.
  - Faire revenir le poivron et les pois chiches dans un filet d'huile avec le paprika
