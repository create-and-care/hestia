  tags:
  - poulet
  servings: 2
  prep_time_minutes:
  cook_time_minutes:
  ingredients:
  - 500 g de pommes de terre
  - "⅔ sachet de mélange d'épices pour BBQ"
  - 1 boîte de maïs
  - 1 sucrine
  - "½ carotte"
  - 1 pot de yaourt à la grecque
  - 2 filets de poulet Label Rouge
  - 40 g de sauce BBQ façon Carolina Gold
  - 2 cs d'huile d'olive
  - 1 cc de vinaigre de vin rouge ou de cidre
  - 1 cc de moutarde
  - sel et poivre
