    et de coppa, puis napper de réduction de vinaigre balsamique.
- source_url: https://www.hellofresh.fr/recipes/market/tartinable-maison-houmous-aux-poivrons-grilles-69ef23a679a9f8cdb074dae8
  title: Houmous maison aux poivrons grillés
  tags:
  - vegetarien
  servings: 2
  prep_time_minutes:
  cook_time_minutes:
  ingredients:
  - 1 paquet de pois chiches
  - 1 paquet de poivrons grillés
  - 1 citron
  - "½ gousse d'ail"
  - 1 sachet de mélange d'épices du Moyen-Orient
  - 1 sachet de graines de courge
  - 3 cs d'huile d'olive
  - sel et poivre
  steps:
  - Égoutter et rincer les pois chiches et les poivrons grillés. Couper un quart des
    poivrons en petits dés et réserver pour le dressage. Couper le citron en quartiers
    et hacher grossièrement la moitié de l'ail.
  - Mixer les pois chiches, l'ail, le jus de deux quartiers de citron et le reste
    des poivrons avec les épices du Moyen-Orient, l'huile d'olive, du sel et du poivre
    jusqu'à obtenir une texture lisse. Ajuster la consistance avec un peu d'eau si
