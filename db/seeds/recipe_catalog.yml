  title: Curry de légumes d'été et pois chiches, gingembre et noix de cajou
  tags:
  - vegetarien
  servings: 2
  prep_time_minutes:
  cook_time_minutes:
  ingredients:
  - 1 pièce(s) Aubergine
  - 1 pièce(s) Oignon
  - 1 pièce(s) Gousse d'ail
  - 1 cm Gingembre frais
  - 1 pièce(s) Courgette
  - 1 pièce(s) Tomate
  - "½ pièce(s) Citron"
  - 150 g Riz
  - 1 sachet(s) Curry en poudre
  - "½ sachet(s) Coriandre"
  - "½ paquet(s) Pois chiches"
  - 1 paquet(s) Lait de coco
  - 1 sachet(s) Noix de cajou concassées
  - 1 cs Huile d'olive
  - 1 cs Beurre
  - "½ pièce(s) Cube de bouillon de légumes"
  - selon le goût Poivre et sel
  steps:
  - Couper l'aubergine et la courgette en cubes, émincer l'oignon et l'ail, râper
    le gingembre.
  - Faire revenir l'oignon, l'ail et le gingembre dans l'huile d'olive et le beurre,
    ajouter le curry en poudre.
  - Ajouter l'aubergine et la courgette, faire revenir quelques minutes jusqu'à légère
    coloration.
  - Incorporer la tomate coupée en dés, les pois chiches égouttés, le lait de coco
    et le bouillon de légumes, laisser mijoter 12 à 15 minutes jusqu'à ce que les
    légumes soient tendres.
  - Cuire le riz selon les indications de l'emballage.
  - Ajouter un filet de jus de citron au curry, parsemer de noix de cajou concassées
    et de coriandre, servir avec le riz.
