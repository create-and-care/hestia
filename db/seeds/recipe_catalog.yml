- source_url: https://www.hellofresh.fr/recipes/filet-mignon-de-porc-au-miel-and-thym-du-chef-69e9ee27b2918f341e7b1c82
  title: Filet mignon de porc au miel et au thym, sauce crémeuse, haricots rôtis
  tags:
  - porc
  servings: 2
  prep_time_minutes:
  cook_time_minutes:
  ingredients:
  - 2 pièce(s) Pommes de terre
  - 1 sachet(s) Haricots verts
  - 1 pièce(s) Oignon
  - 1 pièce(s) Gousse d'ail
  - 2 pièce(s) Filet mignon de porc
  - 1 sachet(s) Thym séché
  - 1 paquet(s) Crème liquide
  - "½ pièce(s) Cube de bouillon de bœuf"
  - 1 cs Huile d'olive
  - 1 cc Miel
  - selon le goût Poivre et sel
  steps:
  - Préchauffer le four à 200°C. Couper les pommes de terre en quartiers, les enfourner
    avec les haricots verts, un filet d'huile d'olive, du sel et du poivre, 20 à 25
    minutes.
  - Assaisonner le filet mignon de porc avec le thym séché, du sel et du poivre, le
    saisir à la poêle avec l'huile d'olive quelques minutes sur toutes les faces.
  - Ajouter l'oignon et l'ail émincés dans la poêle, poursuivre la cuisson du porc
    à feu moyen jusqu'à ce qu'il soit cuit à cœur.
  - Arroser le porc de miel en fin de cuisson pour le laquer légèrement, réserver
    au chaud.
  - Déglacer la poêle avec le bouillon de bœuf, ajouter la crème liquide et laisser
    réduire pour obtenir une sauce onctueuse.
  - Trancher le filet mignon, napper de sauce et servir avec les pommes de terre et
    les haricots rôtis.
