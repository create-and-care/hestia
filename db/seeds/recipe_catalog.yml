  - 1 paquet de pois chiches
  - 1 sachet d'épices à l'italienne
  - 1 paquet de chair de tomates
  - 1 sachet d'épinards
  - 110 g de focaccia
  - 1 sachet de pecorino romano AOP râpé
  - "½ cube de bouillon de légumes"
  - 3 cs d'huile d'olive
  - 2 cc de vinaigre balsamique blanc ou de riz
  - sel et poivre
  steps:
  - Émincer l'oignon et l'ail, couper la carotte et le céleri en petits dés, égoutter
