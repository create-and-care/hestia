  cook_time_minutes:
  ingredients:
  - 1 courgette
  - 1 aubergine
  - 1 gousse d'ail
  - 2 abricots
  - 1 sachet d'épices à l'italienne
  - 1 sachet de pignons de pin
  - 1 tomate côtelée
  - 1 sachet de basilic
  - 5 tranches de coppa
  - 1 sachet de copeaux de grana padano AOP
  - 1 sachet de salade
  - 2 cs d'huile d'olive
  - 2 cc de miel
  - 5 cs de vinaigre balsamique noir
  - sel et poivre
  steps:
  - Préchauffer le four en mode grill à 220°C. Couper la courgette et l'aubergine
    en rondelles, émincer l'ail et couper les abricots en quartiers.
  - Répartir la courgette et l'aubergine sur une plaque avec un filet d'huile, saler
