  title: Truite grillée, sauce béarnaise et fenouil braisé aux pignons
  tags:
  - poisson
  servings: 2
  prep_time_minutes:
  cook_time_minutes:
  ingredients:
  - 2 pommes de terre
  - 1 oignon
  - "½ citron"
  - 1 gousse d'ail
  - 1 fenouil
  - 1 sachet de pignons de pin
  - 2 filets de truite avec peau
  - 40 g de sauce béarnaise
  - 3 cs d'huile d'olive
  - 1 cc de sucre
  - sel et poivre
  steps:
  - Préchauffer le four à 220°C (200°C chaleur tournante). Couper les pommes de terre
    en fines rondelles, les répartir sur une plaque sans les superposer avec un filet
    d'huile, du sel et du poivre. Enfourner 20 à 25 minutes jusqu'à ce qu'elles soient
    dorées.
  - Émincer l'oignon, couper le citron en quartiers, ciseler l'ail. Couper le fenouil
    en quartiers après avoir retiré la partie dure.
  - Faire colorer le fenouil, l'oignon et les pignons de pin dans un filet d'huile
    2 à 3 minutes, ajouter l'ail, le sucre, le jus de citron et un peu d'eau. Couvrir
    et laisser mijoter 10 à 14 minutes jusqu'à ce que les légumes soient fondants.
  - Assaisonner la truite et la dorer dans un filet d'huile 4 à 5 minutes côté peau,
    puis 2 à 3 minutes de l'autre côté, jusqu'à ce qu'elle soit cuite à cœur. La réserver.
  - Réchauffer la sauce béarnaise à feu très doux dans la même poêle pendant 30 secondes,
    en remuant.
  - Répartir les pommes de terre et le fenouil braisé dans les assiettes, ajouter
    la truite à côté et napper de sauce béarnaise.
