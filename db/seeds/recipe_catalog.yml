  title: Mijoté de pois chiches et épinards à l'italienne, pecorino et focaccia
  tags:
  - vegetarien
  servings: 2
  prep_time_minutes:
  cook_time_minutes:
  ingredients:
  - 1 oignon
  - 1 gousse d'ail
  - 1 carotte
  - 70 g de céleri-branche
  - 1 paquet de pois chiches
  - 1 sachet d'épices à l'italienne
  - 1 paquet de chair de tomates
  - 1 sachet d'épinards
  - 110 g de focaccia
  - 1 sachet de pecorino romano AOP râpé
  - "½ cube de bouillon de légumes"
  - 3 cs d'huile d'olive
  - 2 cc de vinaigre balsamique blanc ou de riz
  - sel et poivre
  steps:
  - Émincer l'oignon et l'ail, couper la carotte et le céleri en petits dés, égoutter
    les pois chiches.
  - Faire revenir l'oignon, l'ail, la carotte et le céleri dans un filet d'huile 4
    à 5 minutes avec du sel, puis ajouter le vinaigre balsamique et les épices à l'italienne
    et laisser évaporer.
  - Ajouter la chair de tomates, les pois chiches et le bouillon. Couvrir et laisser
    mijoter 15 à 20 minutes à feu moyen jusqu'à ce que les légumes soient tendres.
  - Déchirer les épinards lavés à la main, les incorporer au mijoté et laisser cuire
    5 minutes de plus jusqu'à ce qu'ils retombent.
  - Pendant ce temps, couper la focaccia en deux et la toaster ou l'enfourner quelques
    minutes jusqu'à ce qu'elle soit dorée, puis l'arroser d'un filet d'huile.
  - Servir le mijoté dans des bols, parsemer de pecorino râpé et accompagner de focaccia.
- source_url: https://www.hellofresh.fr/recipes/la-dolce-vita-legumes-grilles-and-coppa-69dd09a36bb16e39e1b840ce
