  tags: []
  servings: 2
  prep_time_minutes:
  cook_time_minutes:
  ingredients:
  - 1 patate douce
  - 1 paquet de pois chiches
  - 1 oignon
  - "⅔ sachet de cumin en poudre"
  - 1 sachet de persil plat et menthe
  - 1 sachet d'amandes entières grillées non salées
  - 1 pot de labneh
  - 15 g de mélasse de grenade
  - "¾ paquet de fromage à la grecque"
  - 3 cs d'huile d'olive
