  cook_time_minutes:
  ingredients:
  - 1 pièce(s) Gousse d'ail
  - "⅔ sachet(s) Mélange d'épices du Moyen-Orient"
  - 1 paquet(s) Poivrons grillés
  - 150 g Semoule complète
  - 1 sachet(s) Raisins secs Sultanines
  - 4 pièce(s) Merguez
  - 1 pièce(s) Mini concombre / Concombre
  - "½ sachet(s) Coriandre et menthe"
  - 1 pot(s) Yaourt à la grecque
  - 200 ml Bouillon de légumes
  - 2 cc Beurre
  - 1 cs Huile d'olive
  - selon le goût Poivre et sel
  steps:
  - Préparer la semoule complète avec le bouillon de légumes chaud selon les indications
