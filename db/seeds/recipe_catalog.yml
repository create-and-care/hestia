  - Ajouter les émincés de porc marinés, cuire à feu vif jusqu'à ce qu'ils soient
    bien dorés, saupoudrer de paprika fumé et de concentré de tomates.
  - Couper les tomates en dés et ciseler la coriandre.
  - Réchauffer les tortillas à la poêle ou au four.
  - Garnir les tortillas de porc, de cheddar râpé, de dés de tomate, de coriandre
    et d'un peu de crème épaisse.
