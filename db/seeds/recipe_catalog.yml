  tags:
  - vegetarien
  servings: 2
  prep_time_minutes:
  cook_time_minutes:
  ingredients:
  - 150 g de riz
  - 1 gousse d'ail
  - 2 poivrons
  - 180 g de tofu
  - 1 sachet d'épices mexicaines
  - 1 paquet de haricots noirs
  - "½ citron"
  - 1 avocat
  - 1 pot de yaourt à la grecque
  - 1 sachet de cheddar râpé
  - 3 cs d'huile d'olive
  - sel et poivre
  steps:
  - Préchauffer le four à 220°C en mode grill et porter une casserole d'eau salée
    à ébullition. Ciseler l'ail, couper les poivrons en dés, éponger et couper le
    tofu en dés. Cuire le riz 12 à 14 minutes puis l'égoutter et le réserver à couvert.
  - Mélanger les poivrons avec de l'huile et la moitié des épices, étaler sur une
    plaque et enfourner 5 minutes.
  - Mélanger le tofu avec de l'huile et le reste des épices, l'ajouter sur la plaque
    et enfourner 8 à 10 minutes de plus en retournant à mi-cuisson.
  - Égoutter les haricots noirs, couper le citron en quartiers et l'avocat en fines
    lanières.
  - Faire revenir l'ail dans un filet d'huile, ajouter les haricots noirs et un peu
    de jus de citron ; saler et poivrer.
  - Mélanger le riz avec la moitié des poivrons, répartir dans des bols avec les haricots,
    le tofu, le reste des poivrons et l'avocat. Garnir de yaourt, de cheddar et de
    citron.
- source_url: https://www.hellofresh.fr/recipes/bowl-californien-boulgour-et-quinoa-precuits-and-avocat-6a15a018b2ced2367200b236
  title: Bowl California au boulgour et quinoa, cranberries et avocat
  tags:
  - vegetarien
  servings: 2
  prep_time_minutes:
  cook_time_minutes:
  ingredients:
  - 375 g de boulgour et quinoa précuits
  - "½ citron"
  - "½ sachet d'aneth et ciboulette"
  - 1 mini concombre
  - 1 avocat
  - 1 pot de yaourt à la grecque
  - 1 sachet d'épinards
  - 1 sachet de cranberries séchées
  - 30 g de noix de pécan concassées
  - 1 cs d'huile d'olive
  - 2 cc de moutarde
  - sel et poivre
  steps:
  - Réchauffer le boulgour et le quinoa précuits, les mettre dans un saladier, saler,
    poivrer et laisser tiédir légèrement.
  - Laver le citron, en prélever le zeste puis le couper en quartiers. Ciseler les
    herbes fraîches. Couper la moitié du concombre en tranches et l'autre en dés.
