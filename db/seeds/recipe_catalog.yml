---
- source_url: https://www.hellofresh.fr/recipes/market/menu-enfant-nuggets-and-frites-de-patate-douce-6a1daf4656363d596eb66076
  title: Nuggets de poulet croustillants et frites de patate douce
  tags:
  - poulet
  servings: 2
  prep_time_minutes:
  cook_time_minutes:
  ingredients:
  - 1 patate douce
  - 1 mini concombre
  - 2 pommes
  - 1 blanc de poulet
  - 1 sachet de chapelure panko
  - 1 sachet de mayonnaise
  - 1,5 cs d'huile d'olive
  - 1,5 cs de farine
  - 1 œuf
  - 2 cs d'huile de tournesol
  - sel et poivre
  steps:
  - Préchauffer le four à 230°C (210°C en chaleur tournante). Laver la patate douce
    et la couper en frites d'environ 1 cm ; les éponger avec du papier absorbant pour
    qu'elles croustillent bien à la cuisson.
  - Étaler les frites sur une plaque recouverte de papier cuisson, arroser d'un filet
    d'huile d'olive, saler et poivrer. Enfourner 20 à 25 minutes jusqu'à ce qu'elles
    soient bien dorées.
  - Pendant ce temps, couper le concombre en demi-lunes et les pommes en quartiers.
    Retailler les morceaux de poulet si nécessaire.
  - 'Préparer trois assiettes : une avec la farine, une avec la chapelure panko salée
    et poivrée, une avec l''œuf battu. Enrober chaque morceau de poulet successivement
    de farine, d''œuf puis de panko.'
  - Quand il reste 7 à 8 minutes de cuisson aux frites, faire chauffer un peu d'huile
    de tournesol dans une poêle à feu moyen-vif et y dorer les morceaux de poulet
    3 à 4 minutes de chaque côté, jusqu'à ce qu'ils soient bien cuits.
  - Dresser le concombre et les frites dans les assiettes, ajouter les nuggets et
    servir les pommes en dessert.
- source_url: https://www.hellofresh.fr/recipes/market/tartinable-maison-baba-ganoush-daubergine-6a1d4ceb56363d596eb651f6
  title: Baba ganoush d'aubergine maison
  tags:
  - vegetarien
  servings: 2
  prep_time_minutes:
  cook_time_minutes:
  ingredients:
  - 2 aubergines
  - "½ citron"
  - "½ sachet de mélange d'épices du Moyen-Orient"
  - 1 gousse d'ail
  - 1 sachet de sauce tahini
  - 2 cs d'huile d'olive
  - sel et poivre
  steps:
  - Préchauffer le four en mode grill à 230°C. Couper les aubergines en deux dans
    la longueur.
  - Les disposer sur une plaque recouverte de papier cuisson, arroser d'un filet d'huile
    d'olive, saler et poivrer.
  - Enfourner côté chair vers la plaque, 25 à 35 minutes, jusqu'à ce que la chair
    soit tendre (vérifier avec la pointe d'un couteau).
  - Pendant ce temps, émincer l'ail. Laver le citron, en prélever le zeste puis le
    couper en quartiers.
  - Une fois les aubergines cuites, récupérer leur chair à la cuillère et l'écraser
    à la fourchette dans un grand bol.
  - Ajouter un bon filet d'huile d'olive, la sauce tahini, l'ail (selon le goût),
    le zeste et le jus d'un quart de citron, les épices du Moyen-Orient, du sel et
    du poivre. Mélanger, puis rectifier l'assaisonnement avec du jus de citron, du
    sel ou du poivre.
  - Servir dans un bol avec un filet d'huile d'olive par-dessus.
- source_url: https://www.hellofresh.fr/recipes/poke-bowl-thon-sriracha-and-avocat-6a15a164632bb8a09b2dde37
  title: Poké bowl thon, sriracha et avocat
  tags:
  - poisson
  servings: 2
  prep_time_minutes:
  cook_time_minutes:
  ingredients:
  - 375 g de riz complet précuit
  - 1 avocat
  - "½ oignon"
  - 80 g d'edamame
  - 1 carotte
  - 1 sachet de mayonnaise
  - 1 sachet de sauce sriracha
  - 1 boîte de thon au naturel
  - 1 sachet de cacahuètes non salées
  - 20 ml de sauce soja réduite en sel
  - 2 cc de vinaigre balsamique blanc ou de riz
  - sel et poivre
  steps:
  - Tiédir le riz précuit (micro-ondes ou casserole avec un peu d'eau), puis le mélanger
    avec le vinaigre de riz dans un saladier ; réserver à couvert.
  - Couper l'avocat en deux, retirer le noyau, prélever la chair à la cuillère et
    la tailler en fines lanières.
  - Émincer finement l'oignon. Éplucher la carotte et la tailler en fine julienne.
  - Mélanger la mayonnaise et la sriracha selon le goût. Égoutter le thon et l'émietter
    à la fourchette, puis le mélanger avec un tiers de la sauce et l'oignon cru ;
    saler et poivrer.
  - Répartir le riz dans les assiettes, ajouter le thon, les edamame, la carotte et
    l'avocat. Arroser de sauce soja, parsemer de cacahuètes et napper du reste de
    mayo-sriracha.
- source_url: https://www.hellofresh.fr/recipes/bowl-californien-quinoa-and-avocat-6a15a018632bb8a09b2dde10
  title: Bowl California au quinoa, cranberries et avocat
  tags:
  - vegetarien
  servings: 2
  prep_time_minutes:
  cook_time_minutes:
  ingredients:
  - 150 g de quinoa
  - "½ citron"
  - "½ sachet d'aneth et ciboulette"
  - 1 mini concombre
  - 1 avocat
  - 1 pot de yaourt à la grecque
  - 1 sachet d'épinards
  - 1 sachet de cranberries séchées
  - 30 g de noix de pécan concassées
  - 300 ml de bouillon de légumes
  - 1 cs d'huile d'olive
  - 2 cc de moutarde
  - sel et poivre
  steps:
  - Rincer le quinoa à l'eau froide jusqu'à ce qu'elle devienne claire. Porter le
    bouillon à ébullition, y ajouter le quinoa, couvrir et cuire 5 minutes à feu moyen-vif
    puis 8 minutes de plus à feu doux. Rincer à l'eau froide et bien égoutter.
  - Laver le citron, en prélever le zeste puis le couper en quartiers. Ciseler finement
    les herbes fraîches.
  - Couper la moitié du concombre en fines tranches et l'autre moitié en petits dés.
    Couper l'avocat en deux, retirer le noyau et tailler la chair en fines tranches.
  - Mélanger le yaourt avec les herbes, l'huile d'olive, la moutarde, un peu de zeste,
    le jus d'un quart de citron, du sel et du poivre. Dans un saladier, mélanger les
    épinards, le quinoa, les dés de concombre et la moitié de la sauce.
  - Répartir la salade de quinoa dans des bols, disposer harmonieusement les tranches
    d'avocat et de concombre, les cranberries et les noix de pécan par-dessus, puis
    arroser du reste de sauce.
- source_url: https://www.hellofresh.fr/recipes/spicy-bowl-crevettes-dorees-citron-and-mangue-6a15a0cdaa184ea195d71b60
  title: Bowl épicé de crevettes dorées, citron et mangue
  tags:
  - fruits_de_mer
  servings: 2
  prep_time_minutes:
  cook_time_minutes:
  ingredients:
  - "½ citron"
  - 1 gousse d'ail
  - 375 g de riz complet précuit
  - 1 mini concombre
  - "⅔ de mangue"
  - "½ sachet de coriandre"
  - 1 paquet de crevettes
  - "½ sachet de piri-piri"
  - 1 sachet de mayonnaise
  - "½ sachet de graines de sésame"
  - 1 cc de beurre
  - 1 cc d'huile de tournesol
  - sel et poivre
  steps:
  - Laver le citron, en prélever le zeste puis le couper en quartiers. Râper l'ail.
  - Réchauffer le riz précuit, y ajouter un peu de zeste de citron, une noisette de
    beurre, du sel et du poivre ; réserver à couvert.
  - Couper le concombre en petits dés et la mangue en dés. Ciseler la coriandre. Mélanger
    le tout avec un peu de jus de citron, du sel et du poivre.
  - Faire chauffer l'huile de tournesol dans une poêle à feu vif et y colorer les
    crevettes 3 à 4 minutes, jusqu'à ce qu'elles soient cuites à cœur. En fin de cuisson,
    ajouter l'ail et le piri-piri selon le goût.
  - Mélanger la mayonnaise avec une pointe de piri-piri et un peu de jus de citron.
  - Répartir le riz dans des assiettes creuses, ajouter les crevettes et la salade
    mangue-concombre, la mayonnaise épicée sur le côté, et saupoudrer de graines de
    sésame. Servir avec les quartiers de citron restants.
- source_url: https://www.hellofresh.fr/recipes/matar-paneer-curry-depinards-and-petits-pois-69d902206bb16e39e1b7ec48
  title: Matar paneer, curry d'épinards et petits pois
  tags:
  - vegetarien
  servings: 2
  prep_time_minutes:
  cook_time_minutes:
  ingredients:
  - 1 oignon
  - 1 gousse d'ail
  - 1 cm de gingembre frais
  - 200 g de panir
  - 1 sachet de garam masala
  - 1 paquet de chair de tomates
  - 120 g de petits pois
  - 375 g de riz précuit
  - 1 sachet d'épinards
  - 1 sachet de coriandre
  - 1 sachet de noix de cajou concassées
  - 1 cs d'huile de tournesol
  - 1 cc de sucre
  - 2 cc de beurre
  - sel et poivre
  steps:
  - Émincer l'oignon en fines demi-lunes, ciseler l'ail et râper le gingembre. Éponger
    le panir et le couper en dés de 1 à 2 cm.
  - Faire chauffer l'huile dans une sauteuse à feu moyen-vif et y dorer les dés de
    panir 5 à 8 minutes en remuant de temps en temps. Réserver le panir hors de la
    sauteuse.
  - Dans la même sauteuse, faire revenir l'oignon, l'ail et le gingembre 3 à 4 minutes
    jusqu'à légère coloration, puis ajouter le garam masala et cuire 1 minute de plus.
  - Verser la chair de tomates et les petits pois, porter à frémissement. Déchirer
    grossièrement les épinards lavés au-dessus de la sauteuse, ajouter le sucre, saler
    et poivrer. Couvrir et laisser mijoter 6 à 8 minutes jusqu'à ce que les épinards
    retombent, puis incorporer une noisette de beurre.
  - Réchauffer le riz précuit.
  - Remettre le panir dans la sauteuse pour bien l'enrober de sauce. Servir le riz
    avec la sauce à côté, parsemer de coriandre ciselée et de noix de cajou.
- source_url: https://www.hellofresh.fr/recipes/saumon-sauce-avoine-estragon-and-broccolini-poche-6a15a19aaa184ea195d71b72
  title: Saumon, sauce avoine-estragon et broccolini poché
  tags:
  - poisson
  servings: 2
  prep_time_minutes:
  cook_time_minutes:
  ingredients:
  - 500 g de pommes de terre
  - 1 sachet de paprika en poudre
  - 1 sachet de broccolini
  - 1 gousse d'ail
  - 1 échalote
  - "½ sachet d'estragon"
  - 2 filets de saumon avec peau
  - "½ paquet d'avoine cuisine"
  - 2 cs d'huile d'olive
  - 1 cs de beurre
  - 1 cs de vinaigre balsamique blanc ou de riz
  - sel et poivre
  steps:
  - Préchauffer le four à 220°C (200°C chaleur tournante). Laver les pommes de terre
    et les couper en dés de 2 cm. Les répartir sur une plaque avec un filet d'huile
    d'olive et le paprika, saler et poivrer. Enfourner 16 à 20 minutes en remuant
    à mi-cuisson.
  - Pendant ce temps, porter une casserole d'eau salée à ébullition. Émincer l'ail
    et l'échalote, couper le broccolini en deux dans la longueur, ciseler l'estragon.
  - Cuire le broccolini 3 à 5 minutes dans l'eau bouillante (il doit rester un peu
    ferme), l'égoutter et le rincer à l'eau froide. Le réserver avec l'ail et un filet
    d'huile d'olive. Éponger le saumon et l'assaisonner.
  - Faire fondre le beurre dans une poêle à feu moyen-vif et y dorer le saumon 1 à
    2 minutes de chaque côté (il finira de cuire au four).
  - Une fois les pommes de terre cuites, ajouter le broccolini et le saumon sur la
    plaque et enfourner 4 à 8 minutes jusqu'à ce que le saumon soit cuit à cœur.
  - Remettre la poêle du saumon à feu moyen-vif, y faire revenir l'échalote, déglacer
    au vinaigre balsamique et laisser réduire. Baisser le feu, ajouter l'avoine cuisine
    et laisser épaissir 3 à 5 minutes ; saler, poivrer et ajouter l'estragon. Servir
    les pommes de terre, le broccolini et le saumon nappé de sauce.
- source_url: https://www.hellofresh.fr/recipes/burrito-bowl-tofu-avocat-and-sauce-yaourt-6a15a366632bb8a09b2ddecb
  title: Burrito bowl tofu, avocat et sauce au yaourt
  tags:
  - vegetarien
  servings: 2
  prep_time_minutes:
  cook_time_minutes:
  ingredients:
  - 375 g de riz complet précuit
  - 1 gousse d'ail
  - 2 poivrons
  - 180 g de tofu
  - 1 sachet d'épices mexicaines
  - 1 paquet de haricots noirs
  - 1 citron
  - 1 avocat
  - 1 pot de yaourt à la grecque
  - 1 sachet de cheddar râpé
  - 3 cs d'huile d'olive
  - sel et poivre
  steps:
  - Préchauffer le four à 220°C en mode grill. Ciseler l'ail, couper les poivrons
    en petits dés. Éponger le tofu, le presser légèrement et le couper en dés de 2
    cm.
  - Mélanger les poivrons avec un filet d'huile d'olive, la moitié des épices mexicaines,
    du sel et du poivre. Étaler sur une plaque et enfourner 5 minutes.
  - Mélanger le tofu avec un filet d'huile d'olive et le reste des épices. L'ajouter
    sur la plaque à côté des poivrons et enfourner 8 à 10 minutes de plus en retournant
    à mi-cuisson.
  - Égoutter les haricots noirs, couper le citron en quartiers, tailler l'avocat en
    fines lanières. Faire revenir l'ail dans un filet d'huile, ajouter les épices
    restantes et les haricots noirs, cuire 5 minutes puis presser un peu de jus de
    citron ; saler et poivrer.
  - Réchauffer le riz précuit et le mélanger à la moitié des poivrons grillés.
  - Répartir le riz dans des bols, ajouter les haricots, le tofu grillé, le reste
    des poivrons et l'avocat. Garnir de yaourt, de cheddar et des quartiers de citron
    restants.
- source_url: https://www.hellofresh.fr/recipes/burrito-bowl-tofu-avocat-and-sauce-yaourt-6a15a366aa184ea195d71b8d
