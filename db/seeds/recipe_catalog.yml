    de courge et d'un filet d'huile d'olive. Accompagner des quartiers de citron restants.
- source_url: https://www.hellofresh.fr/recipes/pebronata-corse-veau-en-sauce-aux-poivrons-69fb105ca2b8b19764025737
  title: Pebronata corse, veau et lardons mijotés aux poivrons
  tags:
  - veau
  servings: 2
  prep_time_minutes:
  cook_time_minutes:
  ingredients:
  - 1 paquet de sauté de veau
  - 1 oignon
  - 1 poivron
  - 1 gousse d'ail
  - 1 tomate
  - "½ sachet de persil"
  - 75 g de lardons fumés sans nitrite
  - 1 sachet de concentré de tomates
  - 1 feuille de laurier
  - 1 sachet de thym séché
  - 2 pommes de terre
  - 280 ml de bouillon de bœuf
  - 1 cs d'huile d'olive
  - 1 cs de beurre
  - 1 cs de farine
  - 1 cc de sucre
  - sel et poivre
  steps:
  - Couper la viande en dés égaux et l'éponger. Émincer l'oignon, épépiner et couper
    le poivron en lanières, émincer l'ail, couper la tomate en dés et ciseler le persil.
  - Faire dorer le veau et les lardons dans l'huile et le beurre 5 à 7 minutes, puis
