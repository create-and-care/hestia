  tags:
  - fruits_de_mer
  servings: 2
  prep_time_minutes:
  cook_time_minutes:
  ingredients:
  - 1 pièce(s) Gousse d'ail
  - "½ sachet(s) Thym séché"
  - 150 g Semoule
  - 2 pièce(s) Poivron
  - 1 pièce(s) Oignon
  - 1 paquet(s) Crevettes
  - 1 paquet(s) Chair de tomates
  - "½ sachet(s) Piri-piri"
  - 1 sachet(s) Persil
