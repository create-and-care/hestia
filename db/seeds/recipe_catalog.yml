  - Couper le panir en tranches et le dorer 4 à 5 minutes. Couper les naans en deux,
    tartiner de caviar d'aubergine puis de yaourt, garnir de panir grillé sur une
    moitié et refermer.
  - Dorer les naanwichs garnis dans une noisette de beurre 3 à 4 minutes de chaque
    côté en appuyant légèrement. Servir avec la salade de concombre à côté.
