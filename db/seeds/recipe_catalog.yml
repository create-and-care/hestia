  cook_time_minutes:
  ingredients:
  - 1 pièce(s) Oignon
  - 2 pièce(s) Poivron
  - 1 pièce(s) Gousse d'ail
  - 1 paquet(s) Émincés de porc marinés à la mexicaine
  - "½ sachet(s) Concentré de tomates"
  - 1 sachet(s) Cheddar râpé
  - "½ sachet(s) Coriandre"
  - 2 pièce(s) Tomate
  - 4 pièce(s) Tortillas
  - 1 pot(s) Crème épaisse
  - "⅔ sachet(s) Paprika fumé en poudre"
