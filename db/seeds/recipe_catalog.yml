- source_url: https://www.hellofresh.fr/recipes/market/gateau-renverse-a-lananas-69cbf9bf2898d990f0341d6d
  title: Gâteau renversé à l'ananas
  tags:
  - vegetarien
  servings: 2
  prep_time_minutes:
  cook_time_minutes:
  ingredients:
  - 125 g Beurre doux
  - 100 g Sucre de canne
  - 1 pièce(s) Citron
  - 1 pièce(s) Ananas
  - 130 g Farine de blé
  - "¾ sachet(s) Levure chimique"
  - 3 pièce(s) Œuf
  - 2 cs Sucre
  steps:
  - Préchauffer le four à 180°C. Faire fondre une partie du beurre avec le sucre de
    canne dans un moule, verser ce caramel au fond du moule.
  - Couper l'ananas en tranches et les disposer sur le caramel au fond du moule.
  - Fouetter le reste du beurre ramolli avec le sucre, ajouter les œufs un à un, puis
    le zeste de citron.
  - Incorporer la farine tamisée avec la levure chimique, mélanger jusqu'à obtenir
    une pâte homogène.
  - Verser la pâte sur les tranches d'ananas, enfourner 30 à 35 minutes jusqu'à ce
    qu'un couteau planté ressorte sec.
  - Laisser tiédir quelques minutes puis démouler en retournant le gâteau sur un plat.
- source_url: https://www.hellofresh.fr/recipes/whoogys-bavette-laquee-sauce-hoisin-and-salade-carotte-concombre-69d9020168ee73d4d3ffe07a
  title: Bavette laquée à la sauce hoisin, salade carotte-concombre
  tags:
  - boeuf
  servings: 2
  prep_time_minutes:
  cook_time_minutes:
  ingredients:
  - 240 g Bavette de bœuf
  - 150 g Riz
  - 1 pièce(s) Carotte
  - 1 pièce(s) Mini concombre / Concombre
  - "½ pièce(s) Citron"
  - 1 sachet(s) Coriandre
  - 1 sachet(s) Sauce soja au sésame
  - "½ sachet(s) Sauce poisson"
  - 1 sachet(s) Sauce hoisin
  - 1 cc Beurre
  - 2 cc Vinaigre balsamique blanc ou de riz
  - 2 cs Huile d'olive
  - selon le goût Poivre et sel
  steps:
  - Cuire le riz selon les indications de l'emballage.
  - Râper la carotte, couper le concombre en fines lamelles, assaisonner avec le vinaigre,
    un filet d'huile d'olive, du sel et du poivre pour la salade.
  - Assaisonner la bavette de sel et de poivre, la saisir à la poêle avec l'huile
    d'olive 2 à 3 minutes de chaque côté, laisser reposer quelques minutes puis trancher
    finement contre la fibre.
  - Mélanger la sauce hoisin, la sauce soja au sésame et la sauce poisson dans une
    petite casserole, chauffer légèrement avec une noisette de beurre pour la lier.
  - Napper les tranches de bavette de sauce hoisin, ciseler la coriandre par-dessus.
  - Servir la bavette laquée avec le riz et la salade carotte-concombre.
- source_url: https://www.hellofresh.fr/recipes/market/mi-temps-rafraichissante-virgin-mojito-69cbf972a4f29fefb8a588c0
  title: Virgin mojito citron et menthe, format pichet
  tags:
  - boisson
  servings: 2
  prep_time_minutes:
  cook_time_minutes:
  ingredients:
  - 6 pièce(s) Citron
  - 2 sachet(s) Menthe
  - 100 g Sucre de canne
  - 1000 ml Eau
  steps:
  - Presser les citrons pour en extraire le jus.
  - Froisser les feuilles de menthe entre les doigts pour bien libérer leur parfum.
  - Mélanger le jus de citron, le sucre de canne et l'eau dans un grand pichet jusqu'à
    dissolution du sucre.
  - Ajouter la menthe froissée et laisser infuser quelques minutes au réfrigérateur.
  - Servir bien frais sur glaçons, éventuellement avec un trait d'eau gazeuse.
