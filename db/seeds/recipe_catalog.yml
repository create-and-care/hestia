  - 1 mini concombre
  - 1 oignon
  - 1 gousse d'ail
  - 75 g de pâte épicée tikka masala
  - 200 g de panir
  - 2 pains naan
  - 1 pot de yaourt à la grecque
  - 3 cs d'huile d'olive
  - 1 cc de vinaigre balsamique noir
  - 1 cc de beurre
  - sel et poivre
  steps:
  - Préchauffer le four à 220°C (200°C chaleur tournante). Couper l'aubergine épluchée
    en dés, l'assaisonner avec de l'huile, du sel et du poivre, puis l'enfourner 30
    à 35 minutes jusqu'à ce qu'elle soit tendre.
  - Couper le concombre en fines demi-lunes et le faire mariner dans une vinaigrette
    huile-vinaigre balsamique jusqu'au service.
  - Émincer l'oignon et l'ail, les faire revenir dans l'huile 2 à 3 minutes, ajouter
    la pâte tikka masala et un peu d'eau, puis laisser mijoter à couvert 5 à 6 minutes.
  - Ajouter l'aubergine cuite au mélange oignon-tikka, réchauffer 2 à 3 minutes en
