- source_url: https://www.hellofresh.fr/recipes/cabillaud-au-four-and-sauce-vierge-a-lorange-69de49b04af8f3547a643690
  title: Cabillaud au four, sauce vierge à l'orange et fenouil
  tags:
  - poisson
  servings: 2
  prep_time_minutes:
  cook_time_minutes:
  ingredients:
  - 500 g de grenailles
  - "½ sachet de thym séché"
  - 1 fenouil
  - 1 oignon
  - 1 gousse d'ail
  - des tomates cerises rouges
  - "½ sachet d'aneth et persil plat"
  - 1 échalote
  - 1 orange
  - 2 filets de cabillaud sans peau
  - 4 cs d'huile d'olive
  - 2 cc de beurre
  - sel et poivre
  steps:
  - Préchauffer le four à 200°C (180°C chaleur tournante). Couper les grenailles en
    deux si elles sont grosses. Les répartir sur une plaque avec un filet d'huile,
    du sel, du poivre et le thym séché.
  - Couper le fenouil en lanières après avoir retiré la partie dure, et l'oignon en
    quartiers. Dans un plat à four, mélanger le fenouil, l'oignon, la moitié de l'ail
    et la majorité des tomates cerises entières avec de l'huile, du thym, du sel et
    du poivre. Enfourner ce plat avec les grenailles pendant 20 minutes.
  - Pendant ce temps, couper le reste des tomates cerises en petits quartiers, émincer
    finement l'échalote et hacher les herbes fraîches. Prélever le zeste de l'orange,
    couper deux tranches fines et presser le jus du reste.
  - Mélanger dans un bol les herbes, les tomates, l'échalote et un peu d'ail cru avec
    le jus et le zeste d'orange, un filet d'huile d'olive, du sel et du poivre ; laisser
    mariner jusqu'au service.
  - Éponger le cabillaud, l'assaisonner, poser une noisette de beurre et une tranche
    d'orange sur chaque filet. L'ajouter dans le plat une fois les 20 premières minutes
    écoulées et poursuivre la cuisson 10 à 15 minutes, jusqu'à ce que le poisson soit
    cuit et les légumes fondants.
  - Servir les grenailles, les légumes et le cabillaud nappé de sauce vierge à l'orange.
- source_url: https://www.hellofresh.fr/recipes/spaghetti-au-haddock-fume-and-creme-de-courgette-69e9ee6efe534c766c45bcd0
  title: Spaghetti au haddock fumé et crème de courgette
  tags:
  - poisson
  servings: 2
  prep_time_minutes:
  cook_time_minutes:
  ingredients:
  - 180 g de spaghetti
  - 2 courgettes
  - 1 gousse d'ail
  - 1 oignon
  - "½ sachet d'épices à l'italienne"
  - "½ citron"
  - 1 paquet de crème liquide
  - 160 g de filet de haddock fumé avec peau
  - 1 cs d'huile d'olive
  - 1 cc de vinaigre balsamique blanc ou de riz
  - sel et poivre
  steps:
  - Cuire les spaghetti 10 à 12 minutes dans une grande casserole d'eau bouillante
    salée, puis égoutter et réserver à couvert.
  - Pendant ce temps, couper la courgette en fines demi-lunes et émincer l'ail et
    l'oignon.
  - Faire revenir la courgette, l'ail et l'oignon dans un filet d'huile d'olive avec
    les épices à l'italienne, du sel et du poivre pendant 5 à 6 minutes, jusqu'à ce
    que la courgette soit fondante et dorée. Prélever le zeste de citron.
  - Mixer les trois quarts de ce mélange avec la crème, un peu de zeste et de jus
    de citron et le vinaigre balsamique jusqu'à obtenir une sauce lisse. La verser
    sur les pâtes et bien mélanger.
  - Couper le haddock fumé en fines lanières et l'incorporer aux pâtes, en réservant
    quelques lanières pour le dressage.
  - Servir les spaghetti à la crème de courgette avec le reste de courgettes grillées
    et de haddock, et un peu de jus de citron selon le goût.
- source_url: https://www.hellofresh.fr/recipes/market/tartinable-maison-haricots-blancs-and-paprika-6a0d7532099c5b8fd89cb5bc
  title: Tartinade de haricots blancs, paprika fumé et poivrons confits
  tags:
  - vegetarien
  servings: 2
  prep_time_minutes:
  cook_time_minutes:
  ingredients:
  - 1 gousse d'ail
  - 1 poivron
  - 1 sachet d'amandes entières grillées non salées
  - 1 citron
  - "½ sachet de paprika fumé en poudre"
  - 1 paquet de haricots blancs
  - 3 cs d'huile d'olive
  - 1 cc de vinaigre balsamique noir
  - sel et poivre
  steps:
  - Émincer l'ail, couper le poivron en lanières, concasser les amandes et couper
    le citron en quartiers.
  - Faire revenir le poivron avec un peu d'eau à couvert 6 à 8 minutes, jusqu'à ce
    qu'il soit tendre, puis ajouter la moitié de l'ail, un peu de paprika fumé et
    le vinaigre balsamique noir ; poursuivre la cuisson 1 à 2 minutes.
  - Égoutter les haricots blancs et les mixer avec un filet d'huile d'olive, le reste
    d'ail, le jus d'un demi-citron et un peu de paprika fumé jusqu'à obtenir une crème
    lisse (ajouter un peu d'eau pour l'assouplir si besoin). Rectifier l'assaisonnement.
  - Étaler la crème de haricots blancs au fond d'une assiette creuse, répartir le
    poivron confit par-dessus et parsemer d'amandes concassées.
- source_url: https://www.hellofresh.fr/recipes/quinoa-truite-and-fenouil-braises-du-comptoir-69d9023168ee73d4d3ffe141
  title: Quinoa, truite et fenouil braisés, vinaigrette orange-miel
  tags:
  - poisson
  servings: 2
  prep_time_minutes:
  cook_time_minutes:
  ingredients:
  - 1 oignon
  - 1 gousse d'ail
  - 150 g de quinoa
  - "⅔ sachet d'origan séché"
  - 1 fenouil
  - 1 orange
  - 1 sachet de persil
  - 2 filets de truite avec peau
  - 1 sachet d'amandes effilées
  - 300 ml de bouillon de légumes
  - 3 cs d'huile d'olive
  - 1 cs de beurre
  - 1 cc de vinaigre de vin rouge ou de cidre
  - 1 cc de miel
  - 1 cc de moutarde
  - sel et poivre
  steps:
  - Émincer l'oignon et l'ail. Rincer le quinoa. Faire revenir l'oignon dans un filet
    d'huile 3 à 4 minutes, ajouter le quinoa, la moitié de l'ail et l'origan, puis
    faire sauter 1 minute de plus.
  - Verser le bouillon, porter à ébullition puis laisser cuire à couvert environ 13
    minutes à feu doux, jusqu'à absorption complète. Réserver à couvert.
  - Pendant ce temps, couper le fenouil en quartiers après avoir retiré la partie
    dure. Le faire dorer dans une noisette de beurre avec le reste d'ail 1 à 2 minutes,
    puis ajouter un peu d'eau et laisser mijoter à couvert 10 à 14 minutes, jusqu'à
    ce qu'il soit fondant.
  - Prélever le zeste et les segments de l'orange. Ciseler le persil. Préparer une
    vinaigrette avec l'huile d'olive, le vinaigre de vin, le zeste, le miel et la
    moutarde.
  - Assaisonner la truite avec le reste d'origan et la dorer dans un filet d'huile
    4 à 5 minutes côté peau puis 2 à 3 minutes de l'autre côté, jusqu'à ce qu'elle
    soit cuite à cœur.
  - Mélanger les segments d'orange, le fenouil, le quinoa et la moitié du persil dans
    la vinaigrette. Servir le quinoa avec la truite par-dessus, saupoudré d'amandes
    effilées et du reste de persil.
- source_url: https://www.hellofresh.fr/recipes/curry-udon-au-poulet-and-coco-6a0ab8b110e255982cf3f9f7
  title: Curry udon au poulet et lait de coco
  tags:
  - poulet
  servings: 2
  prep_time_minutes:
  cook_time_minutes:
  ingredients:
  - 1 oignon
  - "½ citron"
  - 1 carotte
  - 1 cm de gingembre frais
  - 1 gousse d'ail
  - 1 blanc de poulet
  - 1 sachet de curry en poudre
  - 400 g de nouilles udon fraîches
  - 1 paquet de lait de coco
  - "½ sachet de coriandre"
  - 1 sachet de gomasio
  - 150 ml de bouillon de bœuf
  - 1 cs d'huile de tournesol
  - sel et poivre
  steps:
  - Émincer l'oignon, prélever le zeste de citron et le couper en quartiers. Tailler
    la carotte en rubans à l'éplucheur, râper le gingembre et l'ail.
  - Faire dorer les dés de poulet avec le curry dans un filet d'huile chaude 1 à 2
    minutes, puis ajouter le gingembre, l'ail, l'oignon et la carotte et poursuivre
    la cuisson 5 à 6 minutes, jusqu'à ce que le poulet soit cuit à cœur.
  - Pendant ce temps, plonger les nouilles udon dans un saladier d'eau chaude et les
    délier délicatement, puis les égoutter.
  - Ajouter les nouilles, le bouillon, un peu de zeste de citron et le lait de coco
    dans le wok, et laisser réduire 3 à 4 minutes à feu moyen.
  - Servir dans des assiettes creuses, parsemer de coriandre effeuillée et de gomasio,
    et presser un peu de jus de citron par-dessus.
- source_url: https://www.hellofresh.fr/recipes/bowl-italienne-polpettes-a-la-sauce-tomate-69d9022868ee73d4d3ffe10f
  title: Bowl italien, polpettes et frites de courgette, sauce tomate au basilic
  tags:
  - boeuf
  servings: 2
  prep_time_minutes:
  cook_time_minutes:
  ingredients:
  - 2 courgettes
  - 1 sachet d'épices à l'italienne
  - 150 g de riz
  - 1 gousse d'ail
  - 1 oignon
  - 1 sachet de persil
  - un peu de piment
  - 1 paquet de viande hachée de bœuf
  - 1 paquet de chair de tomates
  - 1 pot de crème de basilic
  - 2 cc d'huile d'olive
  - 1 cs de lait
  - 1 cc de sucre
  - sel et poivre
  steps:
  - Préchauffer le four à 210°C (190°C chaleur tournante) en mode grill. Couper la
    courgette en quartiers, les répartir sur une plaque avec de l'huile et les épices
    à l'italienne, saler et poivrer. Enfourner 20 à 25 minutes jusqu'à ce qu'ils soient
    fondants et dorés.
  - Cuire le riz 12 à 14 minutes, l'égoutter et réserver à couvert. Émincer l'ail
    et l'oignon, ciseler le persil, épépiner et ciseler le piment.
  - Mélanger la viande hachée avec la moitié de l'ail et du persil, un peu de lait,
    du sel et du poivre. Former des boulettes.
  - Faire dorer les boulettes sur toutes leurs faces dans un filet d'huile pendant
    6 à 8 minutes, jusqu'à ce qu'elles soient bien cuites. Les réserver.
  - Dans la même poêle, faire revenir l'oignon 2 à 3 minutes, puis ajouter la chair
    de tomates, la crème de basilic, le reste d'ail et de piment, le sucre et un peu
    d'eau ; laisser réduire 3 à 4 minutes. Remettre les boulettes dans la sauce pour
    les réchauffer.
  - Servir le riz avec les boulettes et leur sauce d'un côté, les courgettes grillées
    de l'autre, et parsemer du reste de persil.
- source_url: https://www.hellofresh.fr/recipes/ravioli-nduja-and-sauce-facon-ratatouille-69d9024868ee73d4d3ffe1a8
  title: Ravioli au nduja, sauce façon ratatouille et chèvre frais
  tags:
  - porc
  servings: 2
  prep_time_minutes:
  cook_time_minutes:
  ingredients:
  - 1 poivron
  - 1 aubergine
  - 1 oignon
  - 1 gousse d'ail
  - 1 tomate
  - "⅔ sachet d'épices à l'italienne"
  - "⅔ sachet de concentré de tomates"
  - 1 pot de crème de basilic
  - 300 g de ravioli nduja et poivrons
  - 1 fromage de chèvre frais
  - 2 cs d'huile d'olive
  - sel et poivre
  steps:
  - Couper le poivron en lanières et l'aubergine en quartiers fins. Émincer l'oignon,
    ciseler l'ail et couper la tomate en dés.
  - Faire revenir l'aubergine, le poivron et l'oignon dans un filet d'huile 4 à 5
    minutes jusqu'à légère coloration, saler et poivrer.
  - Ajouter l'ail, les dés de tomate, les épices à l'italienne, le concentré de tomates,
    la crème de basilic et un peu d'eau. Laisser mijoter à couvert 15 à 17 minutes
    en remuant régulièrement, jusqu'à ce que les légumes soient fondants et la sauce
    onctueuse.
  - Pendant ce temps, cuire les raviolis 3 à 4 minutes dans une eau bouillante salée.
    Réserver un peu d'eau de cuisson puis égoutter. Couper le chèvre frais en petits
    dés.
  - Ajouter les raviolis égouttés dans la sauce avec un peu d'eau de cuisson et mélanger
    délicatement pour bien les enrober.
  - Servir dans des assiettes creuses avec les dés de chèvre frais et le reste de
    crème de basilic par-dessus.
- source_url: https://www.hellofresh.fr/recipes/croque-champis-and-bechamel-a-la-fourme-dambert-69d901f06bb16e39e1b7eb32
  title: Croque aux champignons, béchamel à la fourme d'Ambert et salade pommes-noix
  tags:
  - vegetarien
  servings: 2
  prep_time_minutes:
  cook_time_minutes:
  ingredients:
  - 250 g de champignons de Paris
  - 1 oignon
  - "⅔ sachet d'assaisonnement ail et herbes"
  - 80 g de fourme d'Ambert AOP
  - une pincée de noix de muscade
  - 4 tranches de pain de campagne
  - 1 sachet de salade
  - 1 pomme
  - 1 sachet de noix concassées
  - 2 cs d'huile d'olive
  - 4 cc de vinaigre balsamique noir
  - 10 g de beurre
  - 10 g de farine
  - 200 ml de lait
  - 2 cc de moutarde
  - sel et poivre
  steps:
  - Préchauffer le four à 230°C (210°C chaleur tournante). Nettoyer et émincer les
    champignons, ciseler l'oignon. Les faire revenir dans un filet d'huile 7 à 8 minutes
    avec l'assaisonnement ail et herbes, puis déglacer avec un peu de vinaigre balsamique.
  - Couper la fourme d'Ambert en dés. Préparer un roux avec le beurre et la farine
    dans une casserole, puis incorporer le lait petit à petit en fouettant jusqu'à
    épaississement. Ajouter la fourme et la muscade, mélanger jusqu'à ce que le fromage
    soit fondu, saler et poivrer.
  - Étaler un peu de moutarde sur les tranches de pain, garnir de champignons et de
    béchamel, puis refermer les croques et étaler un peu de béchamel sur le dessus.
  - Enfourner les croques 6 à 8 minutes en position haute, jusqu'à ce qu'ils soient
    bien gratinés.
  - Pendant ce temps, couper la pomme en fines tranches et préparer une vinaigrette
    avec l'huile d'olive et le vinaigre balsamique. Mélanger la salade, la pomme et
    les noix concassées juste avant de servir.
  - Couper les croques en deux et les servir avec la salade.
- source_url: https://www.hellofresh.fr/recipes/burger-de-boeuf-sauce-bbq-moutarde-comme-aux-usa-69e9ee3db2918f341e7b1d16
  title: Burger de bœuf, sauce BBQ-moutarde, cheddar et frites maison
  tags:
  - boeuf
  servings: 2
  prep_time_minutes:
  cook_time_minutes:
  ingredients:
  - 500 g de pommes de terre
  - 1 gousse d'ail
  - 1 sachet de cheddar râpé
  - 1 paquet de viande hachée de bœuf
  - 2 pains à burger
  - 1 tomate
  - 40 g de sauce BBQ façon Carolina Gold
  - 1 sachet de mayonnaise
  - 2 cs d'huile d'olive
  - 1 cc de beurre
  - 1 cc de moutarde
  - sel et poivre
  steps:
  - Préchauffer le four à 210°C (190°C chaleur tournante). Couper les pommes de terre
    en frites, les éponger, les mélanger avec un filet d'huile, du sel et du poivre,
    puis enfourner 30 à 35 minutes en remuant à mi-cuisson.
  - Émincer l'ail et le mélanger à la viande hachée assaisonnée. Façonner des steaks
    d'environ 1 cm d'épaisseur, bien aplatis.
  - Faire dorer les steaks dans un filet d'huile chaude 2 à 3 minutes d'un côté, les
    retourner, ajouter le cheddar, couvrir et cuire 2 à 3 minutes de plus jusqu'à
    ce qu'ils soient cuits à cœur.
  - Quand il reste 5 minutes de cuisson aux frites, couper les pains en deux, les
    beurrer légèrement et les passer au four à côté, face beurrée vers le bas.
  - Mélanger la mayonnaise avec un peu de moutarde. Couper la tomate en rondelles.
  - Étaler la sauce BBQ sur une face du pain et la mayonnaise moutardée sur l'autre.
    Garnir de tomate et du steak au cheddar, refermer le burger et servir avec les
    frites.
- source_url: https://www.hellofresh.fr/recipes/jerk-chicken-label-rouge-and-riz-aux-haricots-69e9ee47a777d4c0e74a79b1
  title: Jerk chicken Label Rouge et riz aux haricots rouges
  tags:
  - poulet
  servings: 2
  prep_time_minutes:
  cook_time_minutes:
  ingredients:
  - 1 poivron
  - 1 gousse d'ail
  - 1 oignon
  - 1 cm de gingembre frais
  - 40 g de pâte épicée jamaïcaine
  - 1 sachet de sauce sriracha
  - 2 cuisses de poulet Label Rouge
  - 150 g de riz au jasmin
  - "¾ paquet de lait de coco"
  - "½ paquet de haricots rouges"
  - 200 ml de bouillon de volaille
  - 4 cs d'huile de tournesol
  - 2 cc de sucre
  - sel et poivre
  steps:
  - Préchauffer le four à 230°C (210°C chaleur tournante). Couper le poivron en lanières,
    émincer l'ail et l'oignon, râper le gingembre.
  - Mélanger dans un plat à four la pâte jamaïcaine, la moitié de l'ail et du gingembre,
    la sriracha, un peu d'huile et de sucre ; y enrober le poulet et enfourner 30
    à 35 minutes jusqu'à cuisson complète.
  - Ajouter le poivron sur une plaque avec un filet d'huile, saler et poivrer, et
    l'enfourner pour les 15 dernières minutes de cuisson du poulet. Badigeonner le
    poulet cuit avec le reste de marinade.
  - Faire revenir l'oignon, le reste d'ail et de gingembre dans l'huile 3 à 4 minutes,
    ajouter le riz et cuire 1 à 2 minutes, puis verser le lait de coco et le bouillon.
    Couvrir et laisser mijoter 12 à 16 minutes à feu doux jusqu'à absorption complète.
  - Rincer et égoutter les haricots rouges, les incorporer au riz cuit hors du feu.
  - Servir le riz aux haricots avec la cuisse de poulet et les poivrons grillés à
    côté.
- source_url: https://www.hellofresh.fr/recipes/porc-sauce-a-lorange-facon-chenpi-chinois-69dd48ea6bb16e39e1b844ad
  title: Porc sauce à l'orange façon chenpi et brocoli au sésame
  tags:
  - porc
  servings: 2
  prep_time_minutes:
  cook_time_minutes:
  ingredients:
  - 150 g de riz au jasmin
  - 1 brocoli
  - 1 gousse d'ail
  - 25 g d'oignon nouveau
  - 1 orange
  - 1 cm de gingembre frais
  - 1 sachet de sauce soja au sésame
  - 1 sachet de sauce soja
  - 1 sachet de graines de sésame
  - 2 tranches de carré de porc
  - 2 sachets d'huile de sésame
  - 1 cc d'huile de tournesol
  - 1 cc de vinaigre balsamique blanc ou de riz
  - 1 cc de miel
  - 2 cs de farine
  - 1 cc de beurre
  - sel et poivre
  steps:
  - Rincer le riz puis le cuire à couvert dans une casserole d'eau salée environ 12
    à 15 minutes à feu doux ; laisser reposer 10 minutes hors du feu et égrener à
    la fourchette.
  - Couper le brocoli en fleurettes, émincer l'ail et l'oignon nouveau. Les faire
    revenir dans un filet d'huile 1 à 2 minutes, puis ajouter un peu d'eau, couvrir
    et laisser étuver 8 à 10 minutes à feu doux.
  - Prélever le zeste et le jus de l'orange, râper le gingembre. Mélanger dans un
    bol la sauce soja-sésame, la sauce soja, les graines de sésame, le reste d'ail
    et de gingembre, un peu de zeste et de jus d'orange, le vinaigre et le miel.
  - Couper le porc en dés, les saupoudrer de farine, saler et poivrer. Les dorer dans
    une noisette de beurre 2 à 3 minutes jusqu'à ce qu'ils ne soient plus rosés, puis
    ajouter la sauce à l'orange et laisser réduire 2 à 3 minutes.
  - Mélanger l'huile de sésame au brocoli et au riz.
  - Servir le riz avec le porc à la sauce orange d'un côté et le brocoli de l'autre,
    garni de vert d'oignon nouveau.
