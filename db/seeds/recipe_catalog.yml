  ingredients:
  - 6 citrons
  - 2 sachets de menthe
  - 100 g de sucre de canne
  - 1000 ml d'eau
  steps:
  - Préparer des glaçons. Laver la menthe et réserver quatre tranches de citron pour
    la décoration.
  - Couper le reste des citrons en quartiers et effeuiller la menthe, en gardant quelques
    feuilles pour la décoration.
  - Placer les quartiers de citron et la menthe dans un pichet avec le sucre, puis
    les écraser légèrement avec un pilon ou une fourchette pour libérer leurs arômes.
  - Répartir des glaçons dans les verres, compléter avec de l'eau (plate ou pétillante)
    et mélanger. Décorer avec les tranches de citron et les feuilles de menthe réservées.
- source_url: https://www.hellofresh.fr/recipes/naanwich-caviar-daubergine-and-panir-grille-69d901badefeabaeea8615f0
  title: Naanwich, caviar d'aubergine et panir grillé
  tags:
  - vegetarien
  servings: 2
  prep_time_minutes:
  cook_time_minutes:
  ingredients:
